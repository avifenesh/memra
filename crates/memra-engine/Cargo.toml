[package]
name = "memra-engine"
description = "From-scratch CUDA LLM inference engine for NVIDIA RTX 50-series (sm_120a) and Hopper (sm_90a) - custom kernels, no frameworks"
version.workspace = true
license.workspace = true
repository.workspace = true
# Shared crates.io browse metadata; see the note in the workspace manifest.
categories.workspace = true
keywords.workspace = true
rust-version.workspace = true
edition = "2024"

[dependencies]
memra-sampling = { workspace = true }
memra-validate = { workspace = true }
memra-kv = { workspace = true }
memra-gguf = { workspace = true }
memra-runtime = { workspace = true }
memra-tokenizer = { workspace = true }
memra-reference = { workspace = true }
cudarc = { version = "0.19", default-features = false, features = ["std", "cuda-13010", "dynamic-loading", "driver", "cublas", "cublaslt", "nvrtc"] }
memmap2 = "0.9"
libc = "0.2"
# dsv4 lane-4 gate receipts: logits-bin sha256 (same version the memra-gguf gates use)
sha2 = "0.10"
# vision input lane: image decode + resize for the Qwen3.8 ViT preprocessor
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
base64 = "0.22"

