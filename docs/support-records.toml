[[record]]
id = "deepseek_v41-gpu-1x-pro6000"
pack = "deepseek_v41"
state = "NativeQualified"
artifact = "deepseek-ai/DeepSeek-V4.1-Flash-1017@1bae0e1088993b9b82de08f59de5be5a34e42170"
numeric_program = "the checkpoint's own program (deepseek-v41-source-program): bf16 activations, FP8 32x32 dense and MXFP4 expert weights as stored, per-32 activation quantization, fp32 accumulation; a prefill call per prompt, then the vendor's decode program one token per call. The running requests' one-token calls go through the trunk together, up to 8 rows a call (MEMRA_DSV41_BATCH_ROWS), each row the bytes of its own call run alone; when every row of a call is a plain greedy pick the card returns each row's argmax (Runner::argmax_rows: the host argmax's token, lowest id among equal maxima) and no logits are downloaded"
topology = "1x RTX PRO 6000 Blackwell Max-Q (sm_120a, 96 GB); every layer's own weights and the head on the card, the 15,360 routed experts in pinned host memory behind a device LRU cache"
route = "memra-server deepseek-v4.1 route (dsv41_serve) over dsv41_gpu::decode"
memra_commit = "6371a9975b609d1786ebfe374baa385b6bce5d77"
notes = "Re-pinned 2026-11-14 from a05173ee27 (bundles perf/receipts/cfix-pro6000/cfix2-m1/verify and serve/receipts/verify-a05173ee27-tiny, kept) to 6371a9975b, the head of memra#1315 on main 63c351a2f4: the route's call flag with a row map (memra#1292: a router row that names no expert fails its own request alone, and the off-card MoE no longer refuses a plan with skipped pairs), the first route-code change after the previous pin, on top of the landing of memra#1286, memra#1294 and memra#1312. At the pin, on one RTX PRO 6000 Max-Q, memra model verify checkpoint (native side dsv41-run on this residency) and verify serve (this commit's memra-server) passed: verified=Checkpoint and verified=Serve; Config, TokenizerTemplate, TensorCensus, CheckpointParity (argmax 51119 on both sides, max abs 2.94 inside the class band) and Serve passed (research/modelplan-onboarding-dsv41-20261109/serve/receipts/verify-6371a9975b/gates.txt; the binaries' sha256 in bins.sha256, the run in run.txt). TinyParity ran on 6371a9975b's exact tree: memra model verify tiny --against deepseek_v41 (verified=Tiny against the pinned oracle; every oracle, fixture and tiny-checkpoint hash equals the earlier pins'; research/modelplan-onboarding-dsv41-20261109/serve/receipts/verify-6371a9975b-tiny/) and ci:verify-tiny's test, memra-cli supported_packs_write_deterministic_native_oracles, 1 passed (tiny-gate-test.log.gz in that directory); the bundle's gates.txt lists TinyParity pending because the checkpoint and serve recipe does not run the tiny gate. RewriteParity stays pending: no rewrite is qualified. DSpark drafts (MEMRA_DSV41_DRAFT, off by default), CUDA graphs, response_format and image parts are not served. In the same window and from the same binaries the row-fault gates ran on this topology: dsv41-gate rowfault over all 40 layers, 9 of 9, and the serve smoke with a poisoned row of a two-row batched call on the 40-layer route, PASS (research/modelplan-onboarding-dsv41-20261109/row-faults/receipts/pro6000-6371a9975b/). Commits after the pin: 80a25d2457 is research receipts and their README, and the commit that writes this record is docs and receipts; tools/cell_evidence.py need from the pin to it prints no device cell. The branch then merges main 0db086f87a, the landing of memra#1310 and memra#1317 (15 commits over 63c351a2f4): the hybrid route's admission and reclaim in the server's worker.rs, the unified-memory readers in the engine's spec.rs, unified_memory.rs and lib.rs, docs and research. What they reach in this route (research/modelplan-onboarding-dsv41-20261109/serve/receipts/verify-6371a9975b-reach/reach.txt): of the route's files only dsv41_gpu/experts.rs changes, by a doc comment on device_memory (its non-comment lines hash the same at both ends, as do dsv4_gpu.rs's, the other file a comment was added to); no non-comment line of dsv41_serve, dsv41_gpu, dsv4_serve or dsv4_admit names unified_memory or spec; none of the sixteen worker items those files use is named in an added or removed line of worker.rs; and Engine::new now reads the device's unified-memory attribute once into a field that these routes do not read. After that merge, 36fb6c17ba (the round-2 review's nits) changes three research files and no file under crates/, docs/ or tools/: the gate binary's sha256 added to verify-6371a9975b/bins.sha256, a smoke script's header comment and the row-faults README; tools/cell_evidence.py need over it prints no device cell. The commit that adds these sentences is this record's notes, two READMEs and the reach receipt named below. The branch then merges main 5a6ae2438e, the landing of memra#1297 and memra#1320 (6 commits over 0db086f87a): under crates/ they change hybrid_forward.rs (the step35 batched GEMM prime splits its tail like every other prime, memra#1275) and the gate binary src/bin/dsv41_gate.rs (the ring gate's padded outputs, memra#1320); the rest is research. tools/change_impact.py maps hybrid_forward.rs to the numeric and perf cells, which are the hybrid route's and are the landing's own records. What the six commits reach in this route (research/modelplan-onboarding-dsv41-20261109/serve/receipts/verify-6371a9975b-reach-5a6ae2438e/reach.txt): no file of dsv41_serve, dsv41_gpu, dsv4_serve, dsv4_admit or dsv4_gpu changes, and worker.rs does not change; the items hybrid_forward.rs changes (step_gemm_prime_ranges, step_gemm_call_rows_max, the StepGemm schedule, PrimeWorkspaceShape::call_rows where step_gemm is set, the GEMM entry of prime_cache_overlaid_inner) are named in no file but hybrid_forward.rs and are reached only through HybridModel (prime_workspace_shape, whose step_gemm is HybridModel::uses_sliding_gated_moe_program, and the prime itself), and no non-comment line of this route's files names HybridModel or any of those items, because the route runs Dsv41Gpu on its own thread; dsv41_gate.rs is a binary target that no library or server source includes, so the change moves what the gate checks and not what the route serves. Every commit after the pin is named here: 80a25d2457, the re-pin, the merge of main 0db086f87a, 36fb6c17ba, the notes commit and the merge of main 5a6ae2438e. The checkpoint and serve gates were not rerun on either merged head. The decode rate of 7.5 tokens per second for one request was measured at 87bbe3bfc8 and is not remeasured for this record; the lane's decode A/B on four cards is in research/modelplan-onboarding-dsv41-20261109/perf/README.md. Other topologies carry no evidence here: the route picks a fully resident trunk where every rank's routed experts fit its card (four ranks on four cards), and that arm ran on no hardware in this record. The TinyParity receipts sit in their own directory beside the serve receipts, not inside another receipt directory."
