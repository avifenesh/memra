[[record]]
id = "inkling2-reference"
pack = "inkling2"
state = "NativeReference"
artifact = "tiny fixture (a seeded checkpoint image in the family's layout, sha256 db3bcf55117349fada275aa5e1261e13f5a703ad5b99c608ab88076326567953); census over thinkingmachines/Inkling-2-Mini@ed40e7da625f594fc9c4990f5f66be24873c22d7"
numeric_program = "f64 reference executor from the stored values: BF16 and F32 tensors widened, NVFP4 and MXFP8 expert banks dequantized exactly. The expert input is set per physical layer: float inputs (the float-activation class, a bring-up and oracle class), or the declared activation quantizer in fp32 on bf16 rows (NVFP4 four-over-six W4A4, MXFP8 W8A8; the default class)"
topology = "cpu"
route = "memra model inspect + verify tiny"
notes = "The tiny gate's main plan is the float-activation class, because that class has an oracle written apart from memra: the transformers PR 51050 trunk, cache, masks and loader ops, source-transformed to f64, with the expert module replaced by the oracle lane's own (stored bytes, each routed expert dequantized exactly, an f64 GEMM), run over the fixture's checkpoint image. The PR program with nothing replaced is 4.8e-5 from that oracle in f64 and 1.7e-4 in f32, argmax equal at 40 of 40 positions; its stock bf16 load is 5.19 away with 14 of 40 (research/modelplan-onboarding-inkling2mini-20261121/tiny/stock-crosscheck.json). The PR's own Interleave, expert module and dequantizer are pinned by module records in memra-reference. The reference matches the oracle to the bit after rounding to f32 on the main fixture and on three schedule variants (prefill chunks ending at 8, 12, 24; at 7, 11, 23; a prefill of 5 then one token per call), which cross the tiny config's sliding window, relative extent and log-scale floor; those four runs are gated on bit equality. A fourth variant runs the family's default class (every layer on its declared quantizer) and is pinned to a CPU simulation of the activation-quant expert program on an f32 stream, written apart from the reference: max abs 2.3e-6 under a tiny-gate band of 1e-5 that also requires the argmax at every position. That simulation is not a capture of a serving binary, so the default class has no vendor oracle here. The pack declares a checkpoint-parity band only for the declared class (inkling2-declared-activation-quant, docs/decisions/INKLING2-DECLARED-CHECKPOINT-PARITY.md), so a float-activation oracle cannot pass for the default class. The tiny checkpoint and its token ids regenerate byte-identically from the tracked generator (reference/ink2_tiny.py, seed 20261121; tiny/generator-run.json). The drafter and the vision tower are contract-owned and not executed: a run returns no draft, and the standalone draft and multimodal entry points refuse the plan by name. No tuned surface implements any operation of the plan and every rewrite is ineligible. Receipts: research/modelplan-onboarding-inkling2mini-20261121/tiny and reference/README.md. TokenizerTemplate and TensorCensus passed at inspect on the pinned checkpoint."
[record.gates]
Config = "passed"
TokenizerTemplate = "passed"
TensorCensus = "passed"
TinyParity = "passed"
CheckpointParity = "pending"
RewriteParity = "pending"
Serve = "pending"
[record.evidence]
Config = ["research/modelplan-onboarding-inkling2mini-20261121/inspect/gates.txt", "ci:verify-tiny"]
TokenizerTemplate = ["research/modelplan-onboarding-inkling2mini-20261121/inspect/gates.txt"]
TensorCensus = ["research/modelplan-onboarding-inkling2mini-20261121/inspect/gates.txt"]
TinyParity = ["research/modelplan-onboarding-inkling2mini-20261121/tiny/gates.txt", "ci:verify-tiny"]

