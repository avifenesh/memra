notes = "Pinned at 39d8e4ab36, the land/inkling2mini-1 head (main 63f806baf9 with memra#1393, #1394, #1395, #1396, #1397, #1401, #1399 at 38925f1ac5, #1398 at ac04e22200 and #1400), whose route runs lane P's adopted program (controller and norms f32, convolutions and router compensated f32, attention f32 tiles with f64 merges). At the pin, on the RTX 5090 Laptop, from the binaries whose sha256 are in serve/land-final-verify/*-verify/SHA256SUMS: memra model verify checkpoint (native side ink2-gpu under MEMRA_ORACLE_OUT) against lane E's CPU tape of the class on the pack's probe, verify serve on that receipt, serve_check all pass, and memra model verify tiny with ci:verify-tiny (serve/land-final-verify/tiny/). The band rule and the per-MoE, trunk and corpus-KL evidence are in docs/decisions/INKLING2-DECLARED-CHECKPOINT-PARITY.md. TokenizerTemplate is the inspect gate on the pinned artifact (memra#1394, research/modelplan-onboarding-inkling2mini-20261121/chat/). Batched decode rows are bit-equal to their solo calls, and sessions past the load's context run the same program (serve/land-final/, serve/land-final-gate/: 0 rows differing, equal digests, red arms move). The drafter gates of lane S pass on the same binaries (serve/land-final-spec/: tiny gate, run-spec K=1..7 28/28 spec equal to plain). After the pin: the data commits that write these records and receipts. RewriteParity stays pending: no rewrite is qualified. No other topology carries evidence. Shipped class: max abs 2.054 under the class band 3.7, argmax 200001 on both sides. Served at full clocks (serve/land-final-verify/shipped/): 57.6, 77.1 and 98.4 output tok/s at c=1, 2 and 4, TPOT p50 17.2 ms at c=1, every answer at c=2 and c=4 equal to its c=1 answer."
