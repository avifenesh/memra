# Support-state records: the only source a pack's declared `support` may come from.
#
# One record = one qualified (or reference-level) capability, keyed by the exact pack family,
# the artifact, the numeric program, the hardware/topology and the serving route. A record
# names the evidence that backs each passed gate. `tools/check-support-states.py` (CI, gates
# job) enforces:
#
#   * every ModelPack static and speech SUPPORT const declares exactly the highest state its
#     own family's records prove, and `support: None` packs have no positive record;
#   * a record names one family; nothing inherits from a sibling family, a shared loader or a
#     similar architecture name;
#   * each passed gate is backed by a tracked `gates.txt` (family taken from its artifact.lock
#     or tiny-gate.tsv) that says `Gate=passed` for the same family, or, for Config and
#     TinyParity only, by the hosted memra-cli test that runs `verify tiny` for every
#     supported pack (`ci:verify-tiny`);
#   * NativeReference needs Config and TinyParity; NativeQualified adds TokenizerTemplate,
#     TensorCensus, CheckpointParity and Serve on a pinned, non-tiny artifact with a memra
#     commit, topology and route; NativeTuned adds RewriteParity;
#   * every NativeReference/NativeQualified/NativeTuned token in README.md, ARCHITECTURE.md,
#     AGENTS.md and docs/ (outside docs/archive/) carries a `<!-- support: <id>[,<id>] -->`
#     marker naming records in that state. A line that names a state without claiming it (pending, negated, a rule)
#     denies it: `<!-- support: none; not NativeQualified -->`, or beside a record,
#     `<!-- support: hy3-bf16-reference; not NativeQualified -->`. A denied state must rank
#     above every named record, so a marker can never deny what its records prove. A bare
#     `<!-- support: none -->` never passes: a glossary line denies the states it defines.
#
# Gates not passed are listed as "pending". A pending gate is the honest state, never a gap to
# paper over. Evidence outside this repository never backs a gate here: a receipt that cannot
# be re-read from the tree is noted in `notes` and does not count.
#
# Fields: id, pack, state, artifact, numeric_program, topology, route, memra_commit (required
# for NativeQualified and NativeTuned), gates (Gate = "passed" | "pending"),
# evidence (Gate = [paths or "ci:verify-tiny"]), notes.
#
# Topology is part of the key, and support is per machine. No record names a GB10 (DGX Spark,
# sm_121a) topology: no model is supported there until its gates run on that machine
# (docs/rigs/dgx-spark.md).

