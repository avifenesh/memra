name: NVFP4 mint checks

on:
  pull_request:
    paths:
      - tools/mint_mimo_v26_nvfp4.py
      - tools/test_mint_mimo_v26_nvfp4.py
      - .github/workflows/nvfp4-mint.yml
  push:
    branches: [main]
    paths:
      - tools/mint_mimo_v26_nvfp4.py
      - tools/test_mint_mimo_v26_nvfp4.py
      - .github/workflows/nvfp4-mint.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvfp4-mint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  numeric-and-artifact-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install CPU numeric dependencies
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest requests huggingface_hub safetensors \
            'nvidia-modelopt[torch] @ git+https://github.com/NVIDIA/Model-Optimizer.git@051d6adb204f10cd3e78d0f824f31a5a01d54831'
      - name: Check numeric reconstruction and serialized corruption detection
        run: python -m pytest -q tools/test_mint_mimo_v26_nvfp4.py
