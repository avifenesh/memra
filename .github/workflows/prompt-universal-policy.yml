name: Prompt universal policy

on:
  pull_request:
    paths:
      - ".github/workflows/prompt-universal-policy.yml"
      - "research/prompt-depth-router-20260922/universal-v12/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/prompt-universal-policy.yml"
      - "research/prompt-depth-router-20260922/universal-v12/**"

permissions:
  contents: read

jobs:
  shared-selector:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify one shared policy and fail-closed prose guard
        run: |
          python3 -m unittest discover \
            -s research/prompt-depth-router-20260922/universal-v12 \
            -p 'test_*.py' -v
      - name: Parse frozen workload source
        run: |
          python3 -m py_compile \
            research/prompt-depth-router-20260922/universal-v12/workloads.py \
            research/prompt-depth-router-20260922/universal-v12/select_shared.py \
            research/prompt-depth-router-20260922/universal-v12/eval.py \
            research/prompt-depth-router-20260922/universal-v12/collect_prose.py \
            research/prompt-depth-router-20260922/universal-v12/quality_tasks.py \
            research/prompt-depth-router-20260922/universal-v12/prose_packets.py \
            research/prompt-depth-router-20260922/universal-v12/score_prose.py \
            research/prompt-depth-router-20260922/universal-v12/score_validation.py \
            research/prompt-depth-router-20260922/universal-v12/measurement_rows_prose.py \
            research/prompt-depth-router-20260922/universal-v12/fit_shared.py \
            research/prompt-depth-router-20260922/universal-v12/arms_shared.py \
            research/prompt-depth-router-20260922/universal-v12/judge_bedrock.py \
            research/prompt-depth-router-20260922/universal-v12/score_final.py
