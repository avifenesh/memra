name: ci

# Compile gate only. GitHub runners have no GPU, so the exactness battery
# (kernel-check, argmax gates, spec self-consistency) runs on the rig before
# any merge (docs/RELEASING.md). What CI catches: broken Rust, broken kernel
# compiles (nvcc runs fine without a GPU), fatbin flag drift, and the text-level
# censuses that keep the tree releasable.
#
# SHAPE (2026-09-02, ci-diet lane). Until this date every step below lived in ONE serial job
# that took 42 min wall per push (run 33582547232: CPU expert companion 767 s, release build
# 542 s, memra-server suite 469 s, clippy 380 s, boundary check 125 s, allowlist drift 124 s),
# while the three parallel jobs finished in under 15 min. Nothing in the serial chain depended
# on its predecessor except through a warm target dir, so the chain is now parallel jobs, each
# with its own rust-cache key, and the wall time is the slowest single job (the publish
# dry-run, about 15 min). Two more rules:
#   * The compile jobs are gated by tools/ci-change-class.sh: a change set made solely of docs,
#     research receipts and corpus text does not compile anything, because the text gates
#     already answer every question such a change can raise. Fail closed: any doubt compiles.
#     The gate reads `code != 'false'` under `!cancelled()`, so a failed or missing
#     classification still compiles (teeth: tools/test_ci_change_class.sh, arm 14).
#   * Superseded pull-request runs are cancelled (concurrency below); main pushes never are.
# Every invocation the fixtures anchor on (tools/test_flags_guard.sh, tools/test_release_guard.sh,
# tools/test_public_boundary.py, tools/test_fatbin_lookup_census.sh) is unchanged in text; only
# the job it lives in moved.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── change class ────────────────────────────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.classify.outputs.code }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      # fetch-depth 0 is cheap on this history (rebuilt 2026-09-01) and is what makes the PR
      # base and the push `before` reachable for the diff.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: classify
        name: Classify the change set (docs-only skips the compile jobs; any doubt compiles)
        run: |
          tools/ci-change-class.sh "${{ github.event_name }}" \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.before }}" \
            "${{ github.event.pull_request.head.sha || github.sha }}" | tee -a "$GITHUB_OUTPUT"

  # ── text gates: every CPU-only census and fixture, plus the CUDA-free unit suites ───────────
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Immutable GitHub Action pin census
        run: |
          tools/check-action-pins.sh
          tools/test_action_pins.sh
          tools/test_install_authenticity.sh
          tools/test_boundary_refs_guard.sh

      - name: Change-class teeth (the docs-only skip fails closed in every arm)
        run: tools/test_ci_change_class.sh

      - name: CPU-only artifact path safety tests
        run: python3 tools/test_nvme_builder_safety.py

      # The flags census is a gate, so its own coverage needs a gate. v0.94.0 found
      # MEMRA_ALLOW_UNKNOWN_PRETOKENIZER invisible to check-flags on two independent counts
      # (crate outside runtime_dirs, const-indirected read); nothing ran the fix's tests, so
      # nothing would notice the hole reopening.
      - name: Flags census self-test
        run: |
          command -v rg >/dev/null || sudo apt-get install -y -q ripgrep
          tools/test_check_flags.sh

      # Gate lint: prevent vacuous gates caused by remove_var on door flags (memra#136)
      - name: Gate remove_var lint & self-test
        run: |
          command -v rg >/dev/null || sudo apt-get install -y -q ripgrep
          tools/check-no-remove-var-gates.sh
          tools/test_check_no_remove_var_gates.sh

      # Docs-registry census (2026-08-30): every file-shaped reference in docs/KERNELS.md
      # resolves against the tracked tree, docs/MODELS.md names support states only from the
      # three-state vocabulary, docs/ROUTER.md exists and stays at or under 60 lines. Text
      # only, well under a second. No grandfather list, same reason check-flags.sh has none.
      - name: Docs-registry census
        run: |
          command -v rg >/dev/null || sudo apt-get install -y -q ripgrep
          tools/docs-registry-census.sh

      # Teeth for the PRE-PUSH flags-census arm (2026-08-23): drives a real `git push`
      # through the real hook into a bare local origin, so the wiring is exercised rather
      # than grepped, and the escape hatch is proven to announce AND log itself.
      - name: Flags-guard pre-push teeth fixture
        run: |
          command -v rg >/dev/null || sudo apt-get install -y -q ripgrep
          tools/test_flags_guard.sh

      # GATE-INTEGRITY-20260819 rounds 1 to 3: one arm per fix, each FORCING the failure, so
      # every check is proven able to fail for the right reason. A-18 of that audit found 11
      # gates and 4 fixtures with no automated caller at all; a fixture nobody runs rots
      # exactly like the gates it protects, which is why every one of them is HERE.
      - name: Gate-integrity teeth fixture (round 2)
        run: tools/test_gate_integrity_r2.sh
      - name: Push-range fixture (round 1)
        run: tools/test_push_range.sh
      - name: Gate-template teeth fixture (round 3)
        run: |
          tools/test_gate_template_integrity.sh
          python3 -m unittest tools.test_generate_arch_gates

      # Release-guard teeth (2026-08-23). Three tag races in one week shipped GitHub releases
      # whose binaries self-report a different version than the tag; tools/release-guard.sh
      # now refuses a mismatched or unclaimed tag in BOTH tag workflows before anything
      # builds, and this fixture proves both refusals fail for the right reason.
      - name: Release-guard teeth fixture
        run: tools/test_release_guard.sh

      # Changelog teeth (2026-09-02): the tag walk, the skip list, the explicit FROM, and the
      # history-root baseline that keeps the first tag on the rebuilt history from dropping the
      # 108 pre-snapshot commits (docs/RELEASING.md, "The 2026-09-01 history swap").
      - name: Changelog teeth fixture
        run: tools/test_changelog.sh

      # RELEASABILITY CENSUSES (2026-08-23). THE THING THAT FAILS AT RELEASE TIME IS NOT
      # EXERCISED AT MERGE TIME: v0.105.0 and v0.106.0 both died on `rust-lld: error:
      # undefined symbol` in the sm_89 cell, plus a half-finished crates.io publish that
      # permanently consumed six version numbers. These three run against the REAL manifests
      # and the REAL workflow files on every push. Text only, under 2 s combined.
      - name: Releasability — workspace publish census (members vs publish.yml list)
        run: tools/workspace-publish-census.sh
      - name: Releasability — stub ABI census (portable-arch stub .cu vs their real twins)
        run: tools/stub-abi-census.py
      - name: Releasability — arch matrix census (ci compiles every arch release builds)
        run: tools/arch-matrix-census.sh
      - name: Releasability census teeth (all three proven able to fail)
        run: tools/test_releasability_census.sh

      # Teeth for the fatbin-vs-lookup census. The census itself runs per arch in the
      # arch-coverage job (it needs a build); its refusals are proven here with a stub
      # cuobjdump, in both directions of exceptions-file rot.
      - name: Fatbin-lookup census teeth
        run: tools/test_fatbin_lookup_census.sh

      # UNIT SUITES with no CUDA dependency at all. These four crates declare no cudarc
      # dependency (checked, not assumed: grep cudarc crates/*/Cargo.toml). --lib and no
      # filter, deliberately: a filtered suite prints a green "0 passed; N filtered out" the
      # day the name moves. Through the SKIP CENSUS (GATE-INTEGRITY-20260819 section 10):
      # twelve #[test] fns in memra-gguf guard on an artifact and `eprintln!("SKIP..."); return;`
      # and PASS; a hosted runner has no /data at all, so they all skip. `verify` first, so a
      # NEW artifact-gated test must be declared in tools/skip-census.tsv or it is born
      # invisible; then `run` counts what actually skipped against the NAMED budget. 12 is
      # the number of model-backed assertions this executor is blind to, stated out loud.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ci-gates
      - name: Unit suites (CUDA-free crates) + skip census
        run: |
          python3 tools/skip-census.py verify \
            --crate memra-tokenizer --crate memra-validate --crate memra-sampling
          MEMRA_GGUF_SKIP_BUDGET=12 python3 tools/skip-census.py run \
            --budget-var MEMRA_GGUF_SKIP_BUDGET --min-passed 130 \
            -- cargo test -p memra-gguf -p memra-tokenizer -p memra-validate -p memra-sampling --lib

  # ── public boundary: what the public repository is permitted to publish ─────────────────────
  # Its own job because the two steps together are ~250 s and share nothing with the fixtures
  # above; a red here names which question failed ("a new violation appeared" vs "an old
  # exemption stopped describing reality") because they are SEPARATE steps.
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Public-boundary policy check
        run: |
          python3 tools/test_public_boundary.py
          python3 tools/check-public-boundary.py check

      # ALLOWLIST DRIFT (2026-08-23). `verify-allowlist` had NO automated caller anywhere and
      # governs what the public repository is permitted to publish across 685 pinned entries. It is
      # the half of the boundary policy that fails SILENTLY: `check` asks "is any tracked blob
      # a violation that is not grandfathered"; it never asks whether a grant still describes
      # anything real. Fail-closed: rc=1 on any drifted entry fails the job. Never --prune here;
      # a job that rewrites the allowlist to make itself green is not a gate. HERE and not in
      # pre-push, measured: 45.9 s on the rig vs a 0.69 s hook. Teeth: VerifyAllowlistTests in
      # tools/test_public_boundary.py, including a wiring arm anchored on this invocation with
      # comment lines stripped.
      - name: Allowlist drift (every grandfathered entry still describes a live finding)
        run: python3 tools/check-public-boundary.py verify-allowlist

  # ── build: every bin, every CUDA fatbin, at the primary arch ────────────────────────────────
  build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install CUDA 13.1 (nvcc + headers only — compile needs no GPU)
        run: tools/install-cuda-ci.sh
      # PINNED to the workspace rust-version, not @stable. The pin itself is rust-toolchain.toml
      # at the repo root; the explicit input pre-installs the exact toolchain. Bump rust-version
      # and this pin together in a deliberate lane. Newest-stable compile coverage lives in the
      # publish-dryrun job, which floats on purpose.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ci-build-120a

      # MEMRA_CUDA_ARCH is EXPLICIT on purpose. It used to be unset, which meant
      # build.rs::detect_arch() decided, and detect_arch probes nvidia-smi, falling back to
      # 120a only because runners have no GPU. What CI compiled was an accident of runner
      # hardware. It is also what made the sm_89 link failure invisible for a day (see the
      # arch-matrix job below).
      - name: Build (all bins, release — compiles every CUDA fatbin)
        run: cargo build --release --bins
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: "120a"

      # The release binary must report a real fingerprint: memra-<version>-<12 hex>, sourced
      # from the tree, never memra-unknown (the 2026-09-01 fleet builds shipped memra-unknown
      # because a container could not resolve the submodule gitfile).
      - name: Build identity (the release binary reports a real fingerprint)
        run: |
          set -euo pipefail
          out=$(./target/release/memra-server --version)
          echo "$out"
          fp=$(printf '%s\n' "$out" | awk '$1=="system_fingerprint"{print $2}')
          src=$(printf '%s\n' "$out" | awk '$1=="build_id_src"{print $2}')
          shape='^memra-[0-9][0-9A-Za-z.+-]*-[0-9a-f]{12}$'
          if printf '%s' 'memra-unknown' | grep -Eq "$shape"; then
            echo "GATE BROKEN: the shape matcher accepts memra-unknown" >&2; exit 1
          fi
          if printf '%s' 'memra-0.123.0-4b1f9c02d7a3' | grep -Evq "$shape"; then
            echo "GATE BROKEN: the shape matcher rejects a valid fingerprint" >&2; exit 1
          fi
          [ -n "$fp" ] || { echo "no system_fingerprint on --version" >&2; exit 1; }
          case "$fp" in *unknown*) echo "fingerprint is degraded: $fp" >&2; exit 1;; esac
          printf '%s' "$fp" | grep -Eq "$shape" || {
            echo "fingerprint $fp is not memra-<version>-<12 hex>" >&2; exit 1; }
          [ "$src" = "source-tree" ] || {
            echo "build id came from '$src', not the source tree" >&2; exit 1; }
          echo "build identity OK: $fp (id: $src)"

      # The parity-geometry rule's own tests live in a module included by the two parity
      # binaries (`#[path = "../parity_geometry.rs"]`), so `-p memra-engine --lib` does NOT
      # reach them; the target has to be named. Nothing in them touches the CUDA driver.
      - name: Parity-geometry rule tests
        run: cargo test --release -p memra-engine --bin dflash_parity --bin dspark_q38_parity
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: "120a"

  # ── clippy: the workspace stays clippy-zero ────────────────────────────────────────────────
  # (lane/clippy-zero-restore-20260901). -D warnings so the count cannot regrow silently: main
  # was clippy-dirty for weeks precisely because nothing gated it. Teeth were closed by hand
  # before wiring: an injected unused import exits 101 under this exact invocation; the clean
  # tree exits 0. --all-targets is wider than --bins by design, since tests carry lints too.
  # `components: clippy` because the action installs the minimal profile. tools/local-ci.sh
  # runs the same invocation, so a local-ci-green tree does not bounce off this job; the
  # agreement holds because the toolchain is pinned to the workspace rust-version the rig runs.
  clippy:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install CUDA 13.1 (nvcc + headers only — compile needs no GPU)
        run: tools/install-cuda-ci.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ci-clippy-120a
      - name: Clippy gate (workspace clippy-zero, -D warnings)
        run: cargo clippy --release --all-targets -- -D warnings
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: "120a"

  # ── memra-server unit suite ────────────────────────────────────────────────────────────────
  # memra-server's test files (the request-contract invariants, the ledger, auth, tool-call
  # parsing, the four API surfaces) had no caller until 2026-08-19. The crate links cudarc,
  # but with `dynamic-loading`, and no test in it constructs an Engine or touches the driver,
  # so it runs on a GPU-less runner. No `--lib`: memra-server is a BINARY-ONLY crate, and
  # `cargo test -p memra-server --lib` exits 101 with "no library targets found".
  server-tests:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install CUDA 13.1 (nvcc + headers only — compile needs no GPU)
        run: tools/install-cuda-ci.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ci-server-tests-120a
      - name: Unit suite (memra-server — HTTP surface + ledger contracts)
        run: cargo test --release -p memra-server
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: "120a"

  # ── memra-engine: the CPU expert backend and the whole engine lib suite ────────────────────
  # memra#18 (2026-09-01): vision::tests and every other memra-engine lib test ran NOWHERE.
  # The only engine test CI ran was `cargo test -p memra-engine cpu_experts --lib`, a NAME
  # FILTER, which is the exact shape this file says elsewhere fails green the day a name moves.
  # Measured 2026-09-02 on the rig with CUDA_VISIBLE_DEVICES empty: 358 passed, 0 failed,
  # 3 ignored (each `#[ignore]` names its CUDA reason; tools/local-ci.sh runs them on the rig
  # with --include-ignored). The suite runs through the skip census like the CUDA-free crates:
  # `verify` reports 0 artifact-gated skipping tests in this crate, so the budget is 0, and the
  # floor of 300 passed refuses a vacuous run.
  engine-tests:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install CUDA 13.1 (nvcc + headers only — compile needs no GPU)
        run: tools/install-cuda-ci.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ci-engine-tests-120a
      - name: Build and verify memra-native CPU expert backend
        run: |
          tools/build_cpu_expert_companion.sh
          MEMRA_CPU_EXPERT_LIB=target/release/libmemra-cpu-experts.so \
            cargo run --release -p memra-engine --bin cpu_native_check
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: "120a"
      - name: Unit suite (memra-engine --lib, unfiltered) + skip census
        run: |
          python3 tools/skip-census.py verify --crate memra-engine
          MEMRA_ENGINE_SKIP_BUDGET=0 python3 tools/skip-census.py run \
            --budget-var MEMRA_ENGINE_SKIP_BUDGET --min-passed 300 \
            -- cargo test --release -p memra-engine --lib
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: "120a"

  # ── non-primary arch coverage ──────────────────────────────────────────────────────────────
  # (2026-09-02) sm_89 and sm_90a left CI and the release matrix together, by owner ruling —
  # the arch-matrix census forbids the half-state where release builds an arch CI does not
  # compile, so "remove the Ada/Hopper CI" and "stop shipping their tarballs" were one
  # decision. Ada/Hopper users build from source; build.rs still accepts 90a/89 and the stub
  # ABI census still keeps cu/*_stub.cu mirroring their real twins for exactly that.
  #
  # What this job still owes: B200 (sm_100a) compile + census + static-teeth coverage. The
  # B200 backend is hardware-qualified and auto-detected, with real NVFP4 W4A8/W4A4 and
  # block-FP8 twins; the static gate below proves their ABI/SASS/layout. Remaining absent
  # fatbin symbols are guarded and declared individually in tools/fatbin-lookup-exceptions.txt.
  # If a cell is ever added to release.yml's arch axis, tools/arch-matrix-census.sh turns this
  # workflow red until that arch is compiled in CI too (here or in the build job).
  #
  # History this job carries: build.rs substitutes DIFFERENT SOURCE FILES per arch, and when
  # 58ce746ad3 added two entry points to cu/mmq_fp8_blk.cu without mirroring them into the
  # stub, sm_89 and sm_90a stopped LINKING while main stayed green — v0.105.0 and v0.106.0
  # both died on it (that is why the stub-ABI census runs on every push). Measured cells
  # (run 32609839631): 90a 553 s, 89 558 s, 100a comparable; parallel, no added wall time.
  # The glibc axis is deliberately NOT mirrored: it changes the libc requirement of the
  # SHIPPED BINARY, not the source set, the symbols, or the link.
  arch-coverage:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false      # one arch failing must not hide the other's result
      matrix:
        cuda_arch: ["100a"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # cuda-cuobjdump-13-1 is here for the fatbin census below, and it is a SEPARATE package
      # from cuda-nvcc-13-1 — the first run of that census failed in CI for exactly this reason
      # (the census refused, correctly, rather than reporting a vacuous pass). It is a host tool;
      # no GPU and no runtime libs. cuobjdump delegates SASS decoding to nvdisasm, which is also
      # packaged separately; the first B200 static-SASS run proved both are required.
      - name: Install CUDA 13.1 (nvcc + headers + SASS tools — no GPU needed)
        run: tools/install-cuda-ci.sh cuda-cuobjdump-13-1 cuda-nvdisasm-13-1

      # Mirrors the release exactly, so it builds on the release's toolchain: the repo-root
      # rust-toolchain.toml pin (which release.yml now names explicitly too). Floating
      # stable here stopped mirroring anything the day releases were pinned.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ci-arch-sm${{ matrix.cuda_arch }}
      - name: Build (all bins, release) at sm_${{ matrix.cuda_arch }}
        run: cargo build --release --bins
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: ${{ matrix.cuda_arch }}
      # STATIC B200 TEETH. A successful 100a link is insufficient: replacing a real static-lib
      # translation unit with an ABI-compatible stub would still link and the fatbin census below
      # cannot see static archives. These gates compile the exact production TUs, assert their C
      # ABI symbols, inspect SASS for NVFP4 UTCOMMA.4X / FP8 UTCQMMA / grouped HMMA, and execute
      # the host-constexpr operand/scale layout bijection test. The policy tests prove block-FP8
      # remains literal-1 opt-in and install.sh refuses an unpublished B200 prebuilt before network.
      # Every command is host-only; none opens the CUDA driver.
      - name: B200 kernel-twin ABI, SASS, layout, and admission gates
        run: |
          research/b200-kernel-twins-dry-20260901/check-layouts.sh
          research/b200-kernel-twins-dry-20260901/check-nvfp4.sh
          research/b200-kernel-twins-dry-20260901/check-fp8.sh
          tools/test_install_b200_policy.sh
          tools/test_b200_phase0_harness.sh
          cargo test --release -p memra-engine b200_dry_policy_tests --lib
          cargo test --release -p memra-engine --bin kernel-check \
            b200_runs_static_nvfp4_checks_without_the_sm120_fatbin_cell
          cargo test --release -p memra-engine --bin kernel-check \
            explicit_fp8_mmq_subcell_skips_without_aborting_default_coverage
          cargo test --release -p memra-engine --bin nvfp4_mmq_check \
            synthetic_fixture_covers_codes_scales_and_exact_activation_blocks
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: "100a"

      # Every kernel the Rust side looks up must be IN the fatbins for this arch.
      # `Engine::func` resolves kernels lazily and panics on a miss, so an arch-scoped `#if`
      # that drops a kernel with no `#else` is a RUNTIME failure on a shipped binary that every
      # compile gate passes. Exceptions are per symbol in tools/fatbin-lookup-exceptions.txt.
      - name: Fatbin-vs-lookup census at sm_${{ matrix.cuda_arch }}
        run: tools/fatbin-lookup-census.py --arch ${{ matrix.cuda_arch }}

  # ── crates.io publish dry-run ──────────────────────────────────────────────────────────────
  # Every crate packages from its own tarball (nothing reaching outside a crate root,
  # Cargo.lock still resolves). Complement of tools/workspace-publish-census.sh, not a
  # duplicate: --dry-run enumerates members from Cargo.toml and never reads publish.yml's crate
  # list; the census compares the list to the members, the dry-run proves each crate builds
  # from its tarball. Floats on newest stable on purpose (the pinned jobs cover the MSRV).
  publish-dryrun:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install CUDA 13.1 (publish verification compiles the kernels)
        run: tools/install-cuda-ci.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ci-publish-dryrun
      - name: cargo publish --dry-run over every publishable member
        run: cargo publish --workspace --exclude memra-probe --locked --dry-run
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: "120a"
