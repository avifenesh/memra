name: ci

# Compile gate only. GitHub runners have no GPU, so the exactness battery
# (kernel-check, argmax gates, spec self-consistency) runs on the rig before
# any merge — see docs/RELEASING.md. What CI catches: broken Rust, broken
# kernel compiles (nvcc runs fine without a GPU), fatbin flag drift.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: CPU-only artifact path safety tests
        run: python3 tools/test_nvme_builder_safety.py

      - name: Public-boundary policy check
        run: |
          python3 tools/test_public_boundary.py
          python3 tools/check-public-boundary.py check

      # ALLOWLIST DRIFT (2026-08-23). `verify-allowlist` had NO automated caller anywhere — not
      # this workflow, not boundary-refs.yml, not the pre-push hook — and no test in
      # tools/test_public_boundary.py touched cmd_verify. The only evidence it had ever passed
      # was two transcript lines in research/public-boundary-20260814/PROGRESS.md. It governs
      # what a public MIT repo is permitted to publish, across 685 pinned entries, and it ran
      # when a human remembered.
      #
      # It is the half of the boundary policy that fails SILENTLY. `check` asks "is any tracked
      # blob a violation that is not grandfathered"; it never asks whether a grant still
      # describes anything real. An entry whose file was edited, deleted or remediated keeps
      # sitting in the list looking like a decision someone made, and `check` cannot report it
      # because there are no matching bytes left to report. Only this mode notices.
      #
      # A SEPARATE STEP, not appended to the one above, so a red names which question failed —
      # "a new violation appeared" and "an old exemption stopped describing reality" want
      # different fixes. Fail-closed: rc=1 on any drifted entry fails the job. Never --prune
      # here; pruning is an owner decision about what to stop grandfathering, and a job that
      # rewrites the allowlist to make itself green is not a gate.
      #
      # HERE AND NOT IN pre-push, measured rather than assumed: verify-allowlist re-runs the full
      # tree evaluation and takes 45.9 s on the rig. The pre-push hook is 0.69 s end to end, so
      # this would be 68x its total cost — the shape that gets hooks disabled and how
      # MEMRA_SKIP_PERF_CI became a habit (four spurious overrides in one day, 2026-08-19). In
      # CI it is ~5% of a run nobody waits on.
      #
      # Teeth: VerifyAllowlistTests in tools/test_public_boundary.py (corrupt -> red, restore ->
      # green, deleted file, rule-scoped expiry, and a wiring arm that reds if this step is
      # removed — anchored on the invocation with comment lines stripped, because a plain
      # substring search matches this very comment).
      - name: Allowlist drift (every grandfathered entry still describes a live finding)
        run: python3 tools/check-public-boundary.py verify-allowlist

      # The flags census is a gate, so its own coverage needs a gate. v0.94.0 found
      # MEMRA_ALLOW_UNKNOWN_PRETOKENIZER invisible to check-flags on two independent counts
      # (crate outside runtime_dirs, const-indirected read) — a flag deciding whether a model
      # loads at all, missed by the check whose job is exactly that. Nothing ran the fix's
      # tests, so nothing would notice the hole reopening.
      - name: Flags census self-test
        run: |
          command -v rg >/dev/null || sudo apt-get install -y -q ripgrep
          tools/test_check_flags.sh

      # Docs-registry census (2026-08-30). The flags census above covers docs/FLAGS.md;
      # this is the same question asked of the other registries, which had no census at
      # all: every file-shaped reference in docs/KERNELS.md resolves against the tracked
      # tree (a renamed .cu or FFI shim leaves a row pointing at nothing, and nothing
      # noticed), docs/MODELS.md names support states only from the three-state
      # vocabulary (NativeReference, NativeQualified, NativeTuned: the enum in
      # crates/memra-gguf/src/model_packs/mod.rs), and docs/ROUTER.md exists and stays
      # at or under 60 lines (the router points at registries; one that grows answers is
      # becoming a second registry). Flags coverage is NOT re-derived here, on purpose:
      # a second implementation could drift green while the first reds. The census only
      # asserts tools/check-flags.sh --list still answers. No grandfather list, same
      # reason check-flags.sh has none. Text-only, well under a second.
      - name: Docs-registry census
        run: |
          command -v rg >/dev/null || sudo apt-get install -y -q ripgrep
          tools/docs-registry-census.sh

      # Teeth for the PRE-PUSH flags-census arm (2026-08-23). The step above is the backstop and
      # stays exactly as it was; the defect it kept exposing was WHEN it ran. main went red three
      # times in one day — 61e99d5337 (MEMRA_TCOL_OPROJ/_REF/_PROF), d7fed25562 (MEMRA_TCOL_FFN,
      # run 32603995018), plus two lanes that inherited the red mid-work — because a lane pushing
      # straight to main posed the census question for the first time HERE, after landing, and
      # every lane behind those commits paid a repair commit for it. tools/hooks/pre-push now runs
      # tools/check-flags.sh (0.55 s, unconditional) and refuses the push instead.
      #
      # This fixture drives a real `git push` through the real hook into a bare local origin, so
      # the wiring is exercised rather than grepped, and the escape hatch is proven to announce
      # AND log itself. Same reason the release-guard fixture landed today: a gate whose teeth
      # nobody has watched close is not evidence.
      - name: Flags-guard pre-push teeth fixture
        run: |
          command -v rg >/dev/null || sudo apt-get install -y -q ripgrep
          tools/test_flags_guard.sh

      # Round 2 of the same audit (GATE-INTEGRITY-20260819). One arm per fix, each FORCING the
      # failure, so every check is proven able to fail for the right reason: the H100 battery's
      # discarded unit suite, its skip-blind kernel-check verdict, the flags fixture's
      # constant-true conjunct, the canary arms that read rc=75 as teeth, and the serving-port
      # occupancy guard. CPU only — stub binaries, throwaway repos, one loopback listener.
      #
      # It is HERE and not merely "available": A-18 of the same audit found 11 gates and 4
      # fixtures with no automated caller at all, and a fixture nobody runs rots exactly like the
      # gates it is meant to protect.
      - name: Gate-integrity teeth fixture (round 2)
        run: tools/test_gate_integrity_r2.sh

      # Round 1's fixture (the pre-push range derivation: merge-base both arms, no HEAD~20
      # fallback). It could not be wired from round 2's branch because the file lived only on
      # lane/prepush-range-fix-20260819 — round 2 recorded "one line of ci.yml at that lane's
      # merge", and this is that line (landed by the v0.96.0 train). 18 assertions, throwaway
      # repos under mktemp, no network.
      - name: Push-range fixture (round 1)
        run: tools/test_push_range.sh

      # Release-guard teeth (2026-08-23). Three tag races in one week shipped GitHub
      # releases whose binaries self-report a different version than the tag
      # (v0.102.0/v0.104.0/v0.104.1, all now "[SKIPPED — version mismatch]"), because
      # only publish.yml guarded the tag. tools/release-guard.sh now refuses a
      # mismatched or unclaimed tag in BOTH tag workflows before anything builds; this
      # fixture proves both refusals fail for the right reason and that the workflows
      # actually call the guard (throwaway repos under mktemp, no network, no cargo).
      - name: Release-guard teeth fixture
        run: tools/test_release_guard.sh

      # RELEASABILITY CENSUSES (2026-08-23). The night the guard above shipped, main was
      # ALREADY unreleasable and had been since that morning — and the guard passed, because
      # every one of its five arms inspects a FIXTURE. Two tags died before anyone looked:
      # v0.105.0 (run 32581590491) and v0.106.0 (run 32608092743), both `rust-lld: error:
      # undefined symbol` in the sm_89 cell, plus a half-finished crates.io publish that
      # permanently consumed six version numbers. The shape both share is the one this repo
      # keeps rediscovering: THE THING THAT FAILS AT RELEASE TIME IS NOT EXERCISED AT MERGE
      # TIME. These three run against the REAL manifests and the REAL workflow files on every
      # push, which is the only reason they would have caught it. Their own teeth are below.
      # Cost: 3 steps, text-only, no cargo/nvcc/GPU — under 2 s combined.
      - name: Releasability — workspace publish census (members vs publish.yml list)
        run: tools/workspace-publish-census.sh
      - name: Releasability — stub ABI census (portable-arch stub .cu vs their real twins)
        run: tools/stub-abi-census.py
      - name: Releasability — arch matrix census (ci compiles every arch release builds)
        run: tools/arch-matrix-census.sh

      - name: Releasability census teeth (all three proven able to fail)
        run: tools/test_releasability_census.sh

      # Teeth for the fatbin-vs-lookup census. The census itself runs per-arch in the
      # release-arch-mirror job (it needs a build); its refusals are proven here, with a stub
      # cuobjdump, because the real toolchain cannot be talked into emitting a fatbin that is
      # missing exactly one kernel. Includes both directions of exceptions-file rot.
      - name: Fatbin-lookup census teeth
        run: tools/test_fatbin_lookup_census.sh

      # Round 3 of the same audit: the generated-gate TEMPLATE, which is where the rules above
      # stop needing to be re-learned — every gate round 2 fixed was written before the rule
      # existed, and every gate generated from this template inherited the defects instead.
      # Teeth are on a gate GENERATED from the fixed template, not on the template text.
      #
      # tools/test_generate_arch_gates.py is here for the same reason: A-18 found it in the list
      # of fixtures with no automated caller at all.
      - name: Gate-template teeth fixture (round 3)
        run: |
          tools/test_gate_template_integrity.sh
          python3 -m unittest tools.test_generate_arch_gates

      # ------------------------------------------------------------------
      # UNIT SUITES with no CUDA dependency at all.
      #
      # GATE-INTEGRITY-20260819 A-5: 51 files across 10 crates carry #[test], and until this
      # step NOTHING enforced `cargo test` anywhere. memra-tokenizer's 5 test files — which
      # include the pre-tokenizer resolution that decides whether a model LOADS, the exact
      # surface the v0.94.0 MEMRA_ALLOW_UNKNOWN_PRETOKENIZER hole lived on — had no caller in
      # any gate or workflow. tools/local-ci.sh (line 2: "the real gate") has zero occurrences
      # of `cargo test`, and the only one in this file was `-p memra-engine cpu_experts --lib`,
      # a NAME FILTER.
      #
      # These four crates declare no cudarc dependency (checked, not assumed: grep cudarc
      # crates/*/Cargo.toml), so they are GPU-free by dependency graph rather than by hope, and
      # they build before the CUDA toolkit is even installed — which is why this step sits
      # HERE, ahead of the 4-minute nvcc install, and fails fast.
      #
      # --lib and no filter, deliberately. A filtered suite is how the engine suite rotted:
      # `cargo test <name>` prints a green "0 passed; N filtered out" the day the name moves.
      #
      # AND THROUGH THE SKIP CENSUS (GATE-INTEGRITY-20260819 section 10). Twelve #[test] fns in
      # memra-gguf guard on an artifact and `eprintln!("SKIP..."); return;` — the test PASSES.
      # A hosted runner has no /data at all, so ALL TWELVE skip and this step reported
      # "90 passed" green in perpetuity while every model-backed assertion, including the
      # nv27b_twin_parity gate that the n_rot rotary-width geometry check lands in, ran zero
      # times. Same shape as A-2's `ALL GREEN (N cells, M skipped)`, in #[test] form.
      #
      # `verify` first: a NEW artifact-gated test must be declared in tools/skip-census.tsv, or
      # it is born invisible. Then `run` counts what actually skipped against a NAMED budget.
      # 12 is not a fudge factor — it is the number of model-backed assertions this executor is
      # blind to, stated out loud. If it grows, this step reds and someone looks. The rig
      # measured 7 on 2026-08-20 with a budget of 0 in tools/validate-h100.sh.
      - name: Unit suites (CUDA-free crates) + skip census
        run: |
          python3 tools/skip-census.py verify \
            --crate memra-tokenizer --crate memra-validate --crate memra-sampling
          MEMRA_GGUF_SKIP_BUDGET=12 python3 tools/skip-census.py run \
            --budget-var MEMRA_GGUF_SKIP_BUDGET --min-passed 130 \
            -- cargo test -p memra-gguf -p memra-tokenizer -p memra-validate -p memra-sampling --lib

      - name: Install CUDA 13.1 (nvcc + headers only — compile needs no GPU)
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -q
          sudo apt-get install -y -q cuda-nvcc-13-1 cuda-cudart-dev-13-1 libcublas-dev-13-1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build and verify memra-native CPU expert backend
        run: |
          tools/build_cpu_expert_companion.sh
          MEMRA_CPU_EXPERT_LIB=target/release/libmemra-cpu-experts.so \
            cargo run --release -p memra-engine --bin cpu_native_check
          cargo test -p memra-engine cpu_experts --lib

      # MEMRA_CUDA_ARCH is EXPLICIT on purpose. It used to be unset, which meant
      # build.rs::detect_arch() decided — and detect_arch probes nvidia-smi, falling back to
      # 120a only because runners have no GPU. So what CI compiled was an accident of runner
      # hardware, and would have silently changed the day a GPU appeared. It is also what made
      # the sm_89 link failure invisible for a day (see the arch-matrix job below).
      - name: Build (all bins, release — compiles every CUDA fatbin)
        run: cargo build --release --bins
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: "120a"

      # memra-server's 13 test files (261 #[test] fns: the request-contract invariants, the
      # ledger, auth, tool-call parsing, the four API surfaces) also had no caller. The crate
      # links cudarc, but with `dynamic-loading`, and no test in it constructs an Engine or
      # touches the driver — so it runs on a GPU-less runner. --release reuses the cache the
      # step above just warmed, so the marginal cost is the test harness link, not a rebuild.
      #
      # It is a SEPARATE step from the CUDA-free suites above on purpose: if a driver-touching
      # test is ever added here it fails in a step whose name says which class it belongs to,
      # instead of turning the fast fail-first suite red for an unrelated reason.
      #
      # No `--lib`: memra-server is a BINARY-ONLY crate, and `cargo test -p memra-server --lib`
      # exits 101 with "no library targets found" — a typo that fails loudly, unlike the
      # filtered-suite shape that fails green.
      - name: Unit suite (memra-server — HTTP surface + ledger contracts)
        run: cargo test --release -p memra-server
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc

      # The parity-geometry rule's own tests. They live in a module included by the two parity
      # binaries (`#[path = "../parity_geometry.rs"]`), so `-p memra-engine --lib` does NOT reach
      # them — the target has to be named. Nothing in them touches the CUDA driver: they write
      # throwaway manifests and assert the refusals, including the case that motivates the whole
      # rule (a reference regenerated with hidden/2 and taps*2 has the identical byte count, so
      # every product-shaped check still passes).
      - name: Parity-geometry rule tests
        run: cargo test --release -p memra-engine --bin dflash_parity --bin dspark_q38_parity
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc

  # ─────────────────────────────────────────────────────────────────────────────────────────
  # RELEASE-ARCH MIRROR (2026-08-23). release.yml builds {120a, 90a, 89}; the job above
  # compiles 120a only, so TWO of the three release arches were compiled for the first time by
  # the tag. That is not a theoretical gap: crates/memra-engine/build.rs substitutes DIFFERENT
  # SOURCE FILES for the non-120a arches (cu/mmq_fp4_stub.cu, cu/mmq_nvfp4_w4a8_stub.cu,
  # cu/mmq_fp8_blk_stub.cu), and when 58ce746ad3 added two entry points to cu/mmq_fp8_blk.cu
  # without mirroring them into the stub, sm_89 and sm_90a stopped LINKING while main stayed
  # green. v0.105.0 and v0.106.0 both died on it, a day apart, with the same
  # `rust-lld: error: undefined symbol`.
  #
  # WHY THIS SHAPE, measured rather than guessed (ci run 32607039282):
  #   - the existing build job is 1373 s wall; its 120a compile step alone is 447 s
  #   - a compile-only cell here MEASURED IN CI (run 32609839631): 90a 553 s, 89 558 s
  #     (predicted 510 s from the step breakdown, so the estimate held)
  #   - run as PARALLEL matrix jobs they finish ~13.6 min BEFORE the existing job, so added
  #     wall-clock latency for a merge is ZERO; the cost is ~18 runner-minutes
  # Local confirmation on 24 cores capped to 10: 120a 3m02s, 89 2m40s, 90a 2m48s — the arches
  # are the same order of magnitude, so no cell is a latency outlier.
  #
  # WHY ONLY THE ARCH AXIS, not release.yml's full 6 cells: the other axis is the glibc floor
  # (ubuntu-22.04 = 2.35, ubuntu-24.04 = 2.39). That changes the libc requirement of the
  # SHIPPED BINARY, not the source set, the symbols, or the link — one OS cannot miss a
  # compile/link failure the other would catch. Mirroring it would double the runner cost and
  # buy nothing this gate is for. If a cell is ever added to release.yml's arch axis,
  # tools/arch-matrix-census.sh turns this workflow red until it is added here too.
  #
  # 100a (B200) is deliberately absent: build.rs accepts it and gives it its own source set
  # (it skips cu/qmatvec_gemm.cu), but release.yml does not build it, so it cannot break a
  # release. Named in docs/RELEASING.md as a known uncovered arch rather than left implicit.
  release-arch-mirror:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false      # one arch failing must not hide the other's result
      matrix:
        cuda_arch: ["90a", "89"]
    steps:
      - uses: actions/checkout@v4

      # cuda-cuobjdump-13-1 is here for the fatbin census below, and it is a SEPARATE package
      # from cuda-nvcc-13-1 — the first run of that census failed in CI for exactly this reason
      # (the census refused, correctly, rather than reporting a vacuous pass). It is a host tool;
      # no GPU and no runtime libs.
      - name: Install CUDA 13.1 (nvcc + headers + cuobjdump — no GPU needed)
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -q
          sudo apt-get install -y -q cuda-nvcc-13-1 cuda-cudart-dev-13-1 libcublas-dev-13-1 cuda-cuobjdump-13-1

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-arch-sm${{ matrix.cuda_arch }}

      # Same command release.yml runs. `--bins` is load-bearing: the failure that killed two
      # tags was a LINK error in the gate binaries, which `cargo check` would never have seen.
      - name: Build (all bins, release) at sm_${{ matrix.cuda_arch }}
        run: cargo build --release --bins
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: ${{ matrix.cuda_arch }}

      # THE RUNTIME HALF. Linking an arch does not prove its fatbins hold every kernel the Rust
      # side looks up: Engine::func (src/lib.rs:1418) resolves lazily by name across seven
      # fatbins and ends in panic!("kernel {name} not in any fatbin"). An arch-scoped #if with no
      # #else therefore ships a binary that passes every compile gate and dies on first use —
      # which is exactly what the v0.107.0 sm_89 tarball does on the batched GDN path, and it was
      # only visible once the LINK failure above stopped hiding it.
      #
      # cuobjdump is a HOST tool, so this needs no GPU, and it runs inside a cell that has
      # already built — seconds, no new job, no added wall time. It reads what nvcc actually
      # emitted rather than re-deriving the preprocessor and hoping to agree with it.
      #
      # What it does NOT prove: that the path executes. That needs real Ada/Hopper silicon we do
      # not have (the rig is sm_120a, prod boxes are untouchable). The class is narrowed, not
      # closed — docs/RELEASING.md says so where sm_89/sm_90a support is described.
      - name: Fatbin-vs-lookup census at sm_${{ matrix.cuda_arch }}
        run: tools/fatbin-lookup-census.py --arch ${{ matrix.cuda_arch }}

  # ─────────────────────────────────────────────────────────────────────────────────────────
  # PUBLISH DRY-RUN (2026-08-23). Packaging was verified at TAG TIME ONLY: publish.yml's
  # dry-run step is `if: github.event_name == 'workflow_dispatch'`, i.e. it ran when someone
  # remembered. Everything `cargo package` does differently from an in-tree build — excluding
  # files outside a crate directory, stripping path deps down to their version requirement,
  # rebuilding each crate from its own tarball — was therefore first exercised by the tag.
  #
  # WHAT THIS CATCHES that tools/workspace-publish-census.sh cannot: packaging drift. A crate
  # that builds in-tree but not from its packaged tarball (a build.rs or include_str! reaching
  # outside the crate root, a missing file, a path dep with no version).
  #
  # WHAT IT CANNOT CATCH, stated because it is the trap: `--workspace` enumerates members from
  # Cargo.toml and never reads publish.yml's crate list, so it packages memra-reference happily
  # while the real publish loop skips it. It would have passed on 2026-08-22 with the exact
  # stale list that then burned six crates.io version numbers. The census is what catches that.
  # These two are complements, not alternatives — neither alone is sufficient.
  #
  # COST, measured locally on 24 cores capped to 10: 372 s wall, exit 0. Parallel with the
  # 1373 s build job, so no added wall-clock latency for a merge.
  #
  # --locked on purpose: it is the only place in this workflow that proves Cargo.lock still
  # resolves, and lock drift is otherwise a tag-time-only failure (release.yml does not use it).
  publish-dryrun:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA 13.1 (publish verification compiles the kernels)
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -q
          sudo apt-get install -y -q cuda-nvcc-13-1 cuda-cudart-dev-13-1 libcublas-dev-13-1

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-publish-dryrun

      # memra-probe is publish = false in its own manifest and excluded here for the same
      # reason publish.yml excludes it. The census asserts those two exclusions agree.
      - name: cargo publish --dry-run over every publishable member
        run: cargo publish --workspace --exclude memra-probe --locked --dry-run
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: "120a"
