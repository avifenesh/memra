name: ci

# CPU compilation/tests and declared contract checks. Native qualification runs on the
# actual target through the scoped local plan, never on these GPU-less runners.
# tools/validation_plan.py follows Cargo dependencies (including dev/build/target edges)
# and declared external inputs. A changed server module does not rerun engine unit suites;
# an upstream crate reaches all consumers. Unknown inputs select the complete CI plan.
# Every job checks output != 'false' with !cancelled(): planner failure cannot skip it.
# Exact commands and the impact/omission explanation are retained as validation-plan.json.

on:
  workflow_call:
    outputs:
      validated_head:
        description: Exact commit whose complete CPU inventory passed
        value: ${{ jobs.complete.outputs.validated_head }}
  schedule:
    - cron: '19 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-full-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── change class ────────────────────────────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Full inventory selection is a workflow constant, never PR script output.
    outputs:
      code: "true"
      reason: Complete CPU inventory selected by workflow
      build: "true"
      clippy: "true"
      server: "true"
      engine: "true"
      portable: "true"
      core: "true"
      lanes: "true"
      arch: "true"
      publish: "true"
      packages: ""
      requires_cuda: "true"
      contracts: ""
    steps:
      # Selection and the head receipt are workflow literals. No candidate
      # planner or change-class script can suppress the complete inventory.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        name: Plan the complete CPU inventory
        run: |
          python3 -I - <<'PY'
          import json, os, pathlib
          jobs = {name: True for name in ('build', 'clippy', 'server', 'engine', 'portable', 'core', 'lanes', 'arch', 'publish')}
          plan = {'schema': 'memra-full-workflow-selection-v1', 'mode': 'full',
                  'head': os.environ['GITHUB_SHA'], 'jobs': jobs, 'packages': 'workspace',
                  'contracts': 'all available normal/native; mandatory callers remain dedicated steps',
                  'selection_source': 'workflow literals', 'qualification': False}
          pathlib.Path('validation-plan.json').write_text(json.dumps(plan, indent=2) + '\n')
          print(json.dumps(plan, sort_keys=True))
          PY
      - name: Retain the affected-edge and omitted-check explanation
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-plan
          path: validation-plan.json
          if-no-files-found: error
          retention-days: 14

  # ── text gates: every CPU-only census and fixture, plus the CUDA-free unit suites ───────────
  gates:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Isolate the gates toolchain from runner component files
        run: |
          task_rustup_home="$(mktemp -d "$RUNNER_TEMP/memra-gates-rustup.XXXXXX")"
          printf 'RUSTUP_HOME=%s\n' "$task_rustup_home" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"
          components: clippy,rustfmt
      - name: Verify the pinned compiler and components
        run: |
          rustc --version
          cargo clippy --version
          cargo fmt --version

      - name: Immutable GitHub Action pin census
        run: |
          tools/check-action-pins.sh
          tools/test_action_pins.sh
          tools/test_install_authenticity.sh
          tools/test_boundary_refs_guard.sh

      - name: Change selection and edge coverage refusal controls
        run: |
          python3 tools/validation_plan.py check-registry
          tools/test_ci_change_class.sh
          tools/unittest-floor.sh tools 'test_validation_*.py' 241
          tools/unittest-floor.sh tools test_model_memory_fixture.py 3

      - name: Ensure ripgrep for source admission censuses
        run: |
          if ! command -v rg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ripgrep
          fi
          rg --version

      - name: Public CPU CI event, source and result integration
        timeout-minutes: 8
        run: python3 tools/test_public_ci_integration.py

      - name: Declared changed-input CPU contracts (missing selection runs all available)
        run: python3 tools/validation_plan.py contracts
        env:
          CI_VALIDATION_CONTRACTS: ${{ needs.changes.result == 'success' && needs.changes.outputs.contracts || '' }}

      - name: Expert-tier plan self-test assertion admission (CPU-only)
        run: |
          python3 tools/build_expert_tier_plan.py --self-test
          python3 tools/run_expert_tier_contract.py

      - name: SFT generator CPU control admission
        run: python3 tools/run_sft_gen_contract.py

      - name: Score-shard self-test assertion admission (CPU-only)
        run: |
          python3 tools/merge_expert_score_shards.py --self-test
          python3 tools/run_score_shard_contract.py

      - name: Agreement-summary self-test assertion admission (CPU-only)
        run: |
          python3 tools/summarize_hy3_plan_agreement.py --self-test
          python3 tools/run_agreement_summary_contract.py

      - name: Exact-source coalescer membership and wait contracts (CPU-only)
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.server != 'false' }}
        run: python3 tools/check-coalescer-contract.py --out "$RUNNER_TEMP/coalescer-contract"

      # Duplicate mapping keys: GitHub refuses the whole workflow file and runs ZERO jobs (main at
      # 34ed99dfc, 2026-09-21: two portable-suites jobs from #592 and #590). This step can only
      # protect the OTHER workflow files (a ci.yml that does not parse never reaches it); ci.yml
      # itself is protected by the same census in tools/hooks/pre-push and by a PR run on a
      # current merge ref. PyYAML's safe_load keeps the last key silently; the checker is a
      # standard-library walker, so it needs no install line and cannot fail for a dependency.
      - name: Workflow files carry no duplicate mapping key (stdlib walker; safe_load would pass)
        run: |
          tools/check-workflow-keys.py
          tools/test_workflow_keys.sh

      # A hand-resolved merge left a diff3 base marker in research/INDEX.md on main twice on
      # 2026-09-21 (#604, #614) and once in research/tune-data/perf-ci.jsonl; a union resolve
      # then dropped the neighbouring INDEX row. git diff --check sees a marker only inside a
      # diff; this census sees the tracked tree.
      - name: Tracked source, docs and data carry no merge-conflict marker line
        run: |
          tools/check-conflict-markers.sh
          tools/test_conflict_markers.sh

      - name: Content-bound release qualification controls (CPU-only)
        run: |
          python3 tools/test_release_qualification.py
          python3 tools/test_release_inputs.py
          python3 -m unittest tools.test_check_hardware_gate
          python3 -m unittest tools.test_request_fault_gate

      - name: Prepare compiler input isolation
        run: bash tools/install-release-sandbox-ci.sh
      - name: Compiler input view and filesystem boundary (CPU-only)
        run: |
          python3 tools/test_release_input_view.py

      - name: Local development selection and immutable reuse controls (CPU-only)
        run: |
          tools/unittest-floor.sh tools test_local_build_cache.py 48
          tools/unittest-floor.sh tools test_dense_control_cache.py 55
          tools/unittest-floor.sh tools test_build_measurement.py 2
          tools/unittest-floor.sh tools/fast-gate test_plan.py 39
          tools/unittest-floor.sh tools/fast-gate test_component.py 4

      - name: Cache qualification harness regressions (unittest floor 15; 16 measured 2026-09-21)
        run: tools/unittest-floor.sh tools test_cache_qualification.py 15

      - name: Q35 cold-mixed gate grid law and banked replay (unittest floor 13; 13 measured 2026-09-27, memra#777)
        run: tools/unittest-floor.sh tools test_q35_cold_mixed_gate.py 13

      - name: CPU-only artifact path safety tests
        run: python3 tools/test_nvme_builder_safety.py

      - name: Chain-launched kernels open with the PDL entry
        run: python3 tools/check-pdl-chain.py

      - name: Per-card native qualification runner controls
        run: python3 tools/test_qualify_model_device_memory.py

      # The flags census is a gate, so its own coverage needs a gate. v0.94.0 found
      # MEMRA_ALLOW_UNKNOWN_PRETOKENIZER invisible to check-flags on two independent counts
      # (crate outside runtime_dirs, const-indirected read); nothing ran the fix's tests, so
      # nothing would notice the hole reopening. check-flags.sh also runs the row-shape
      # census (tools/flags-row-shape.py, memra#127: row length, default cell, one decide-by,
      # FLAGS-HISTORY.md links), and this self-test carries one red arm per rule.
      - name: Flags census self-test
        run: |
          command -v rg >/dev/null || sudo apt-get install -y -q ripgrep
          tools/test_check_flags.sh

      # Gate lint: prevent vacuous gates caused by remove_var on door flags (memra#136)
      - name: Gate remove_var lint & self-test
        run: |
          command -v rg >/dev/null || sudo apt-get install -y -q ripgrep
          tools/check-no-remove-var-gates.sh
          tools/test_check_no_remove_var_gates.sh

      # Docs-registry census (2026-08-30): every file-shaped reference in docs/KERNELS.md
      # resolves against the tracked tree, docs/MODELS.md names support states only from the
      # three-state vocabulary, docs/ROUTER.md exists and stays at or under 60 lines. Text
      # only, well under a second. No grandfather list, same reason check-flags.sh has none.
      - name: Docs-registry census
        run: |
          command -v rg >/dev/null || sudo apt-get install -y -q ripgrep
          tools/docs-registry-census.sh

      # Support-state census (memra#551): every pack declares exactly the highest state its
      # own family's records in docs/support-records.toml prove, each passed gate is backed
      # by a tracked same-family gates.txt or the verify-tiny test below, and every state token
      # in the docs names the record behind it. The second command is the red fixture: each
      # arm plants one overclaim in a scratch copy and requires the census to fail on it.
      - name: Support-state census
        run: |
          python3 tools/check-support-states.py
          python3 tools/test_check_support_states.py

      # Teeth for the PRE-PUSH flags-census arm (2026-08-23): drives a real `git push`
      # through the real hook into a bare local origin, so the wiring is exercised rather
      # than grepped, and the escape hatch is proven to announce AND log itself.
      - name: Flags-guard pre-push teeth fixture
        run: |
          command -v rg >/dev/null || sudo apt-get install -y -q ripgrep
          tools/test_flags_guard.sh

      # GATE-INTEGRITY-20260819 rounds 1 to 3: one arm per fix, each FORCING the failure, so
      # every check is proven able to fail for the right reason. A-18 of that audit found 11
      # gates and 4 fixtures with no automated caller at all; a fixture nobody runs rots
      # exactly like the gates it protects, which is why every one of them is HERE.
      - name: Gate-integrity teeth fixture (round 2)
        run: tools/test_gate_integrity_r2.sh
      - name: Argmax-margin input and verdict controls
        run: python3 tools/test_argmax_margin_gate.py
      - name: Push-range fixture (round 1)
        run: |
          python3 tools/test_push_range_setup.py
          tools/test_push_range.sh
      - name: Gate-template teeth fixture (round 3)
        run: |
          tools/test_gate_template_integrity.sh
          python3 -m unittest tools.test_generate_arch_gates
          tools/test_spec_on_cache_hit_gate_lock.sh

      # Release-guard teeth (2026-08-23). Three tag races in one week shipped GitHub releases
      # whose binaries self-report a different version than the tag; tools/release-guard.sh
      # now refuses a mismatched or unclaimed tag in BOTH tag workflows before anything
      # builds, and this fixture proves both refusals fail for the right reason.
      - name: Release-guard teeth fixture
        run: tools/test_release_guard.sh
      - name: Release-battery coverage fixtures (CPU only)
        run: python3 tools/test_release_battery_coverage.py

      # Physical GPU resolution fixtures (memra#264 reopened, CPU only). CUDA_VISIBLE_DEVICES
      # can select a physical card other than 0; these command-routing tests plant an NVML
      # stand-in and assert logical device 0 resolves to the physical UUID it actually names,
      # for an ordinal selector, a UUID selector, a reordered visible set, and both directions
      # of asymmetric free memory. No GPU touches this fixture.
      - name: Physical GPU resolution fixtures (CPU only)
        run: python3 tools/test_resolve_physical_gpu.py

      # Changelog teeth (2026-09-02): the tag walk, the skip list, the explicit FROM, and the
      # history-root baseline that keeps the first tag on the rebuilt history from dropping the
      # 108 pre-snapshot commits (docs/RELEASING.md, "The 2026-09-01 history swap").
      - name: Changelog teeth fixture
        run: tools/test_changelog.sh

      # RELEASABILITY CENSUSES (2026-08-23). THE THING THAT FAILS AT RELEASE TIME IS NOT
      # EXERCISED AT MERGE TIME: v0.105.0 and v0.106.0 both died on `rust-lld: error:
      # undefined symbol` in the sm_89 cell, plus a half-finished crates.io publish that
      # permanently consumed six version numbers. These three run against the REAL manifests
      # and the REAL workflow files on every push. Text only, under 2 s combined.
      - name: Releasability — workspace publish census (members vs publish.yml list)
        run: tools/workspace-publish-census.sh
      - name: Releasability — stub ABI census (portable-arch stub .cu vs their real twins)
        run: tools/stub-abi-census.py
      - name: Releasability — arch matrix census (ci compiles every arch release builds)
        run: tools/arch-matrix-census.sh
      - name: Releasability census teeth (all three proven able to fail)
        run: tools/test_releasability_census.sh

      # Teeth for the fatbin-vs-lookup census. The census itself runs per arch in the
      # arch-coverage job (it needs a build); its refusals are proven here with a stub
      # cuobjdump, in both directions of exceptions-file rot.
      - name: Fatbin-lookup census teeth
        run: tools/test_fatbin_lookup_census.sh

      # UNIT SUITES with no CUDA dependency at all. These crates declare no cudarc
      # dependency (checked, not assumed: grep cudarc crates/*/Cargo.toml). --lib and no
      # filter, deliberately: a filtered suite prints a green "0 passed; N filtered out" the
      # day the name moves. Through the SKIP CENSUS (GATE-INTEGRITY-20260819 section 10,
      # memra #484): a test whose artifact is absent prints `SKIP[<artifact>]: <reason>` and
      # PASSES, one line per missing case. `verify` first, over every crate, so a NEW
      # artifact-gated test must be declared in tools/skip-census.tsv or it is born invisible,
      # and any other skip-shaped print fails as unstructured; then `run` counts the protocol
      # lines that actually printed against the NAMED budget. A hosted runner has no /data and
      # no model checkpoints, so 20 is the number of model-backed assertions this executor is
      # blind to, stated out loud: 13 memra-gguf rows (the two qwen4exp census fixtures are
      # committed and run), 2 detokenize rows and 3 staged-tokenizer cases in memra-tokenizer,
      # and 2 Whisper transcript rows in memra-reference. Before #484 the census counted only
      # capital `SKIP` prints and this number read 12 while 8 skips went uncounted.
      # --min-passed is the non-vacuity floor for the whole suite and it has to move when the
      # suite does: adding memra-reference took the pass count to 417, so a floor left at 130
      # would have let all ~68 of that crate's speech tests disappear behind a green check.
      # 400 leaves slack for the declared skips and for honest single-test removals only.
      - name: Skip census negative controls (memra #484)
        run: |
          python3 tools/skip-census.py verify
          tools/unittest-floor.sh tools test_skip_census.py 18
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ci-gates
      - name: Unit suites (CUDA-free crates) + skip census
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.core != 'false' }}
        run: |
          python3 tools/skip-census.py verify
          MEMRA_GGUF_SKIP_BUDGET=20 python3 tools/skip-census.py run \
            --budget-var MEMRA_GGUF_SKIP_BUDGET --min-passed 400 \
            -- cargo test -p memra-gguf -p memra-reference -p memra-tokenizer -p memra-validate -p memra-sampling --lib
      - name: Canonical config and shared JSON feature-unification contracts
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.core != 'false' }}
        run: |
          cargo test -p memra-gguf --test canonical_config
          cargo test -p memra-gguf --features serde_json/preserve_order --test canonical_config
          cargo test -p memra-gguf --features serde_json/preserve_order --lib strict_json::tests
      - name: Network guard address classification contracts (CPU-only, no skips or ignores)
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.core != 'false' }}
        run: |
          if [ -f crates/memra-net-guard/Cargo.toml ]; then
            mkdir -p target
            python3 tools/skip-census.py verify --crate memra-net-guard
            MEMRA_SKIP_BUDGET=0 python3 tools/skip-census.py run \
              --budget-var MEMRA_SKIP_BUDGET --min-passed 15 \
              --log target/net-guard-tests.log -- cargo test -p memra-net-guard --locked
            python3 - <<'PYCODE'
          import pathlib, re
          text = pathlib.Path("target/net-guard-tests.log").read_text()
          ignored = re.findall(r"test result: ok\. \d+ passed; 0 failed; (\d+) ignored;", text)
          assert ignored and all(int(n) == 0 for n in ignored), "net-guard tests must execute without ignored cases"
          PYCODE
          fi
      - name: Indexed MLA and KDA memory fixture contracts (CPU-only)
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.engine != 'false' }}
        run: tools/test-model-memory-fixture.sh

      # memra-lanes is CUDA-free and was outside every unit suite, so the lane admission
      # policy and the streaming-audio scheduler had NO caller in CI: the audio red arms
      # (a batch-1 per-lane drive shedding at c4, a short probe that cannot see it) would
      # have been tests nothing ran. Named separately from the census above because
      # memra-lanes has no skip budget to verify.
      - name: Unit suite (memra-lanes — lane admission + streaming-audio scheduler)
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.lanes != 'false' }}
        run: cargo test -p memra-lanes --lib

  # ── public boundary: what the public repository is permitted to publish ─────────────────────
  # Its own job because the two steps together are ~250 s and share nothing with the fixtures
  # above; a red here names which question failed ("a new violation appeared" vs "an old
  # exemption stopped describing reality") because they are SEPARATE steps.
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Public-boundary policy check
        run: |
          python3 tools/test_public_boundary.py
          python3 tools/check-public-boundary.py check

      # ALLOWLIST DRIFT (2026-08-23). `verify-allowlist` had NO automated caller anywhere and
      # governs what the public repository is permitted to publish across 685 pinned entries. It is
      # the half of the boundary policy that fails SILENTLY: `check` asks "is any tracked blob
      # a violation that is not grandfathered"; it never asks whether a grant still describes
      # anything real. Fail-closed: rc=1 on any drifted entry fails the job. Never --prune here;
      # a job that rewrites the allowlist to make itself green is not a gate. HERE and not in
      # pre-push, measured: 45.9 s on the rig vs a 0.69 s hook. Teeth: VerifyAllowlistTests in
      # tools/test_public_boundary.py, including a wiring arm anchored on this invocation with
      # comment lines stripped.
      - name: Allowlist drift (every grandfathered entry still describes a live finding)
        run: python3 tools/check-public-boundary.py verify-allowlist

  # ── build: every bin, every CUDA fatbin, at the primary arch ────────────────────────────────
  build:
    needs: changes
    env:
      CI_VALIDATION_PACKAGES: ${{ needs.changes.result == 'success' && needs.changes.outputs.packages || '' }}
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.build != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install CUDA 13.1 (nvcc + headers only — compile needs no GPU)
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.requires_cuda != 'false' }}
        run: tools/install-cuda-ci.sh
      # PINNED to the workspace rust-version, not @stable. The pin itself is rust-toolchain.toml
      # at the repo root; the explicit input pre-installs the exact toolchain. Bump rust-version
      # and this pin together in a deliberate lane. Newest-stable compile coverage lives in the
      # publish-dryrun job, which floats on purpose.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ci-build-120a

      # Transport only. The helper recomputes the complete current compiler input
      # identity and checks all six payloads; an action restore is never a gate pass.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: dense_cache
        with:
          path: target/dsv4-control-cache
          key: dense-control-v2-${{ runner.os }}-lookup-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dense-control-v2-${{ runner.os }}-

      # MEMRA_CUDA_ARCH is EXPLICIT on purpose. It used to be unset, which meant
      # build.rs::detect_arch() decided, and detect_arch probes nvidia-smi, falling back to
      # 120a only because runners have no GPU. What CI compiled was an accident of runner
      # hardware. It is also what made the sm_89 link failure invisible for a day (see the
      # arch-matrix job below).
      - name: Build affected packages and consumers (release bins)
        run: python3 tools/validation_plan.py cargo build
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: "120a"

      # The release binary must report a real fingerprint: memra-<version>-<12 hex>, sourced
      # from the tree, never memra-unknown (the 2026-09-01 fleet builds shipped memra-unknown
      # because a container could not resolve the submodule gitfile).
      - name: Build identity (the release binary reports a real fingerprint)
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.server != 'false' }}
        run: |
          set -euo pipefail
          out=$(./target/release/memra-server --version)
          echo "$out"
          fp=$(printf '%s\n' "$out" | awk '$1=="system_fingerprint"{print $2}')
          src=$(printf '%s\n' "$out" | awk '$1=="build_id_src"{print $2}')
          shape='^memra-[0-9][0-9A-Za-z.+-]*-[0-9a-f]{12}$'
          if printf '%s' 'memra-unknown' | grep -Eq "$shape"; then
            echo "GATE BROKEN: the shape matcher accepts memra-unknown" >&2; exit 1
          fi
          if printf '%s' 'memra-0.123.0-4b1f9c02d7a3' | grep -Evq "$shape"; then
            echo "GATE BROKEN: the shape matcher rejects a valid fingerprint" >&2; exit 1
          fi
          [ -n "$fp" ] || { echo "no system_fingerprint on --version" >&2; exit 1; }
          case "$fp" in *unknown*) echo "fingerprint is degraded: $fp" >&2; exit 1;; esac
          printf '%s' "$fp" | grep -Eq "$shape" || {
            echo "fingerprint $fp is not memra-<version>-<12 hex>" >&2; exit 1; }
          [ "$src" = "source-tree" ] || {
            echo "build id came from '$src', not the source tree" >&2; exit 1; }
          echo "build identity OK: $fp (id: $src)"

      # The parity-geometry rule's own tests live in a module included by the two parity
      # binaries (`#[path = "../parity_geometry.rs"]`), so `-p memra-engine --lib` does NOT
      # reach them; the target has to be named. Nothing in them touches the CUDA driver.
      - name: Parity geometry and argmax instrument tests
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.engine != 'false' }}
        run: cargo test --release -p memra-engine --bin dflash_parity --bin dspark_q38_parity --bin argmax-margin-probe
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: "120a"

      # These tests exercise RNG/CDF boundaries, timing contracts and drift metrics;
      # they never create a CUDA context or run the gates' main functions.
      - name: DSV4 sampled, drift and composition CPU contract tests
        id: dense_controls
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.engine != 'false' }}
        run: |
          cargo test --release -p memra-engine --bin dsv4_tp_ep_sampled_perf_gate --bin dsv4_compose_cadence_dense_gate --bin dsv4_hc_dot_split_gate --bin dsv4-dense-arm-ab
          set -euo pipefail
          CARGO_TARGET_DIR="$PWD/target" bash tools/test-dsv4-dense-control-policy.sh | tee "$RUNNER_TEMP/dense-control-policy.log"
          python3 - "$RUNNER_TEMP/dense-control-policy.log" "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys
          from pathlib import Path
          records = [json.loads(line) for line in Path(sys.argv[1]).read_text().splitlines()
                     if line.startswith('{"status"')]
          if len(records) != 1:
              raise SystemExit("dense cache must report exactly one result")
          record = records[0]
          key = record.get("key") if record["status"] in ("built", "restored") else None
          if key is not None:
              if not isinstance(key, str) or not re.fullmatch(r"[0-9a-f]{64}", key):
                  raise SystemExit("invalid validated dense cache key")
              with Path(sys.argv[2]).open("a") as output:
                  output.write("cache-key=" + key + "\n")
          PY
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: "120a"
          MEMRA_DSV4_REPLAY_CADENCE: "1"
          MEMRA_DSV4_DENSE_EXACT_TAIL: "1"

      # Reuse one bounded artifact per validated semantic input key. An unchanged
      # restore never creates another archive under a run-specific upload key.
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: ${{ steps.dense_controls.outputs.cache-key != '' && steps.dense_cache.outputs.cache-matched-key != format('dense-control-v2-{0}-{1}', runner.os, steps.dense_controls.outputs.cache-key) }}
        with:
          path: target/dsv4-control-cache
          key: dense-control-v2-${{ runner.os }}-${{ steps.dense_controls.outputs.cache-key }}

  # ── clippy: the workspace stays clippy-zero ────────────────────────────────────────────────
  # (lane/clippy-zero-restore-20260901). -D warnings so the count cannot regrow silently: main
  # was clippy-dirty for weeks precisely because nothing gated it. Teeth were closed by hand
  # before wiring: an injected unused import exits 101 under this exact invocation; the clean
  # tree exits 0. --all-targets is wider than --bins by design, since tests carry lints too.
  # `components: clippy` because the action installs the minimal profile. tools/local-ci.sh
  # runs the same invocation, so a local-ci-green tree does not bounce off this job; the
  # agreement holds because the toolchain is pinned to the workspace rust-version the rig runs.
  clippy:
    needs: changes
    env:
      CI_VALIDATION_PACKAGES: ${{ needs.changes.result == 'success' && needs.changes.outputs.packages || '' }}
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.clippy != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install CUDA 13.1 (nvcc + headers only — compile needs no GPU)
        run: tools/install-cuda-ci.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ci-clippy-120a
      - name: Clippy affected packages and consumers (-D warnings)
        run: python3 tools/validation_plan.py cargo clippy
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: "120a"

  # ── memra-server unit suite ────────────────────────────────────────────────────────────────
  # memra-server's test files (the request-contract invariants, the ledger, auth, tool-call
  # parsing, the four API surfaces) had no caller until 2026-08-19. The crate links cudarc,
  # but with `dynamic-loading`, and no test in it constructs an Engine or touches the driver,
  # so it runs on a GPU-less runner. No `--lib`: memra-server is a BINARY-ONLY crate, and
  # `cargo test -p memra-server --lib` exits 101 with "no library targets found".
  server-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.server != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install CUDA 13.1 (nvcc + headers only — compile needs no GPU)
        run: tools/install-cuda-ci.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ci-server-tests-120a
      - name: Unit suite (memra-server — HTTP surface + ledger contracts)
        run: cargo test --release -p memra-server
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: "120a"
      - name: Compile n-choice accounting observer (no native execution)
        run: cargo build --locked --release -p memra-server --example choice_accounting_gate
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: "120a"

  # ── tier, KV and onboarding-CLI suites (memra #545) ─────────────────────────────────────────
  # Until 2026-09-21 these suites were COMPILED here (build, clippy) and EXECUTED by nobody:
  # memra-tier's six integration suites (contracts, storage, bank, peer, placement, reclaim) and
  # its compile-fail doctests, memra-kv's lib and contracts_v12 suites, memra-cli's onboarding
  # receipts; 325 tests on 2026-09-21, among them the retirement, cancellation and ownership
  # rules whose red arms nothing in CI had ever run. CPU only and GPU-less by construction
  # (memra-tier has no CUDA dependency; memra-kv links cudarc dynamic-loading and no test opens
  # the driver; memra-cli depends on gguf/reference/tokenizer), so no CUDA install. One wrapper,
  # tools/portable-suites.sh, the same text tools/local-ci.sh runs, through the skip census at
  # budget 0 (a test that skips for a missing artifact is printed and counted; today none
  # exists in the three crates). tools/test_portable_suites.sh is the teeth: a planted failing
  # tier/KV/CLI test in a copy of the tree must red the same wrapper, so build and clippy alone
  # can never satisfy this job. The last step holds BOTH rig lock paths for the whole collector
  # test suite (lead ruling 12, 2026-09-21): a serving job on a rig must never redden a CPU
  # suite, so its tests take the two lock names under a private directory
  # (MEMRA_TIER_BATTERY_LOCK_DIR, docs/TESTING.md). NOT GPU qualification: nothing here promotes
  # a model, a numeric program, a default or a support state, and the step names say so.
  portable-suites:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.portable != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ci-portable-suites
      - name: Warm the registry (the suites run --offline against the committed lockfile)
        run: cargo fetch --locked
      - name: Tier, KV and onboarding-CLI suites (CPU execution through the skip census; NOT GPU qualification)
        run: tools/portable-suites.sh
      - name: Portable-suites teeth (planted tier/KV/CLI failures and an undeclared skip must red the same wrapper)
        run: tools/test_portable_suites.sh
      - name: Collector test suite with BOTH rig lock paths held (ruling 12; CPU tests, not qualification)
        run: |
          exec 8>/tmp/memra-5090.lock 7>/tmp/memra-gpu.lock
          flock -n 8 && flock -n 7
          echo "holding /tmp/memra-5090.lock and /tmp/memra-gpu.lock for the whole suite"
          # Non-vacuity floor (revuto on #592): discovery over a non-package dir exits 0 (or 5 on
          # Python 3.12+) on zero tests. 87 measured 2026-09-21; a stated minimum, raise it as the
          # suite grows, never lower it to pass.
          tools/unittest-floor.sh crates/memra-tier/tests/battery 'test_*.py' 80
      - name: unittest-floor teeth (empty discovery, a failing test and a floor above the count must all red)
        run: tools/test_unittest_floor.sh
      - name: GPU CI orchestration failure controls (CPU only; from #590, unittest floor 9, 10 measured 2026-09-21)
        run: tools/unittest-floor.sh tools test_gpu_ci.py 9

  # ── memra-engine: the CPU expert backend and the whole engine lib suite ────────────────────
  # memra#18 (2026-09-01): vision::tests and every other memra-engine lib test ran NOWHERE.
  # The only engine test CI ran was `cargo test -p memra-engine cpu_experts --lib`, a NAME
  # FILTER, which is the exact shape this file says elsewhere fails green the day a name moves.
  # Measured 2026-09-02 on the rig with CUDA_VISIBLE_DEVICES empty: 358 passed, 0 failed,
  # 3 ignored (each `#[ignore]` names its CUDA reason; tools/local-ci.sh runs them on the rig
  # with --include-ignored). The suite runs through the skip census like the CUDA-free crates:
  # `verify` reports 0 artifact-gated skipping tests in this crate, so the budget is 0, and the
  # floor of 300 passed refuses a vacuous run.
  engine-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.engine != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install CUDA 13.1 (nvcc + headers only — compile needs no GPU)
        run: tools/install-cuda-ci.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ci-engine-tests-120a
      - name: Build and verify memra-native CPU expert backend
        run: |
          tools/build_cpu_expert_companion.sh
          MEMRA_CPU_EXPERT_LIB=target/release/libmemra-cpu-experts.so \
            cargo run --release -p memra-engine --bin cpu_native_check
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: "120a"
      # ── CPU expert companion: prefetch accounting (memra#586) ──────────────────────────────
      # Process-level cells over the production translation unit: a mirrored projection is two
      # I/O jobs and ONE in-flight charge, released once with its final half. The mirror sits on
      # a second filesystem (/dev/shm) and both are read O_DIRECT; the script refuses to run
      # where either is unavailable rather than skipping (docs/TESTING.md, Fixtures).
      - name: CPU expert companion prefetch accounting cells
        run: tools/test_cpu_expert_prefetch.sh "$RUNNER_TEMP/cpu-prefetch-logs"
      # ── DSV4F door reach (memra #454, #458) ──────────────────────────────────────────────
      # Named so a failure reads as what it is: a door's declared default or served-path reach
      # stopped matching the admission code. The unfiltered suite below runs it too; this step
      # exists so the gate has its own caller and its own line in the log.
      - name: DSV4F door reach gate
        run: "cargo test --release -p memra-engine --lib dsv4_doors::"
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: "120a"
      - name: Unit suite (memra-engine --lib, unfiltered) + skip census
        run: |
          python3 tools/skip-census.py verify --crate memra-engine
          MEMRA_ENGINE_SKIP_BUDGET=0 python3 tools/skip-census.py run \
            --budget-var MEMRA_ENGINE_SKIP_BUDGET --min-passed 300 \
            -- cargo test --release -p memra-engine --lib
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: "120a"

  # ── non-primary arch coverage ──────────────────────────────────────────────────────────────
  # (2026-09-02) sm_89 and sm_90a left CI and the release matrix together, by owner ruling —
  # the arch-matrix census forbids the half-state where release builds an arch CI does not
  # compile, so "remove the Ada/Hopper CI" and "stop shipping their tarballs" were one
  # decision. Ada/Hopper users build from source; build.rs still accepts 90a/89 and the stub
  # ABI census still keeps cu/*_stub.cu mirroring their real twins for exactly that.
  #
  # What this job still owes: B200 (sm_100a) compile + census + static-teeth coverage. The
  # B200 backend is hardware-qualified and auto-detected, with real NVFP4 W4A8/W4A4 and
  # block-FP8 twins; the static gate below proves their ABI/SASS/layout. Remaining absent
  # fatbin symbols are guarded and declared individually in tools/fatbin-lookup-exceptions.txt.
  # If a cell is ever added to release.yml's arch axis, tools/arch-matrix-census.sh turns this
  # workflow red until that arch is compiled in CI too (here or in the build job).
  #
  # History this job carries: build.rs substitutes DIFFERENT SOURCE FILES per arch, and when
  # 58ce746ad3 added two entry points to cu/mmq_fp8_blk.cu without mirroring them into the
  # stub, sm_89 and sm_90a stopped LINKING while main stayed green — v0.105.0 and v0.106.0
  # both died on it (that is why the stub-ABI census runs on every push). Measured cells
  # (run 32609839631): 90a 553 s, 89 558 s, 100a comparable; parallel, no added wall time.
  # The glibc axis is deliberately NOT mirrored: it changes the libc requirement of the
  # SHIPPED BINARY, not the source set, the symbols, or the link.
  arch-coverage:
    needs: changes
    env:
      CI_VALIDATION_PACKAGES: ${{ needs.changes.result == 'success' && needs.changes.outputs.packages || '' }}
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.arch != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false      # one arch failing must not hide the other's result
      matrix:
        cuda_arch: ["100a"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cuda-cuobjdump-13-1 is here for the fatbin census below, and it is a SEPARATE package
      # from cuda-nvcc-13-1 — the first run of that census failed in CI for exactly this reason
      # (the census refused, correctly, rather than reporting a vacuous pass). It is a host tool;
      # no GPU and no runtime libs. cuobjdump delegates SASS decoding to nvdisasm, which is also
      # packaged separately; the first B200 static-SASS run proved both are required.
      - name: Install CUDA 13.1 (nvcc + headers + SASS tools — no GPU needed)
        run: tools/install-cuda-ci.sh cuda-cuobjdump-13-1 cuda-nvdisasm-13-1

      # Mirrors the release exactly, so it builds on the release's toolchain: the repo-root
      # rust-toolchain.toml pin (which release.yml now names explicitly too). Floating
      # stable here stopped mirroring anything the day releases were pinned.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ci-arch-sm${{ matrix.cuda_arch }}
      - name: Build affected native packages at sm_${{ matrix.cuda_arch }}
        run: python3 tools/validation_plan.py cargo build
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: ${{ matrix.cuda_arch }}
      # STATIC B200 TEETH. A successful 100a link is insufficient: replacing a real static-lib
      # translation unit with an ABI-compatible stub would still link and the fatbin census below
      # cannot see static archives. These gates compile the exact production TUs, assert their C
      # ABI symbols, inspect SASS for NVFP4 UTCOMMA.4X / FP8 UTCQMMA / grouped HMMA, and execute
      # the host-constexpr operand/scale layout bijection test. The policy tests prove block-FP8
      # remains literal-1 opt-in and install.sh refuses an unpublished B200 prebuilt before network.
      # Every command is host-only; none opens the CUDA driver.
      - name: B200 kernel-twin ABI, SASS, layout, and admission gates
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.engine != 'false' }}
        run: |
          research/b200-kernel-twins-dry-20260901/check-layouts.sh
          research/b200-kernel-twins-dry-20260901/check-nvfp4.sh
          research/b200-kernel-twins-dry-20260901/check-fp8.sh
          tools/test_install_b200_policy.sh
          tools/test_b200_phase0_harness.sh
          cargo test --release -p memra-engine b200_dry_policy_tests --lib
          cargo test --release -p memra-engine --bin kernel-check \
            b200_runs_static_nvfp4_checks_without_the_sm120_fatbin_cell
          cargo test --release -p memra-engine --bin kernel-check \
            explicit_fp8_mmq_subcell_skips_without_aborting_default_coverage
          cargo test --release -p memra-engine --bin nvfp4_mmq_check \
            synthetic_fixture_covers_codes_scales_and_exact_activation_blocks
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: "100a"

      # Every kernel the Rust side looks up must be IN the fatbins for this arch.
      # `Engine::func` resolves kernels lazily and panics on a miss, so an arch-scoped `#if`
      # that drops a kernel with no `#else` is a RUNTIME failure on a shipped binary that every
      # compile gate passes. Exceptions are per symbol in tools/fatbin-lookup-exceptions.txt.
      - name: Fatbin-vs-lookup census at sm_${{ matrix.cuda_arch }}
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.engine != 'false' }}
        run: tools/fatbin-lookup-census.py --arch ${{ matrix.cuda_arch }}

  # ── crates.io publish dry-run ──────────────────────────────────────────────────────────────
  # Every crate packages from its own tarball (nothing reaching outside a crate root,
  # Cargo.lock still resolves). Complement of tools/workspace-publish-census.sh, not a
  # duplicate: --dry-run enumerates members from Cargo.toml and never reads publish.yml's crate
  # list; the census compares the list to the members, the dry-run proves each crate builds
  # from its tarball. Floats on newest stable on purpose (the pinned jobs cover the MSRV).
  publish-dryrun:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.publish != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: stable
      CI_VALIDATION_PACKAGES: ${{ needs.changes.result == 'success' && needs.changes.outputs.packages || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install CUDA 13.1 (publish verification compiles the kernels)
        run: tools/install-cuda-ci.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ci-publish-dryrun
      - name: Package verification over affected members and their dependencies
        run: python3 tools/validation_plan.py cargo publish
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: "120a"

  complete:
    name: Complete CPU inventory result
    needs: [changes, gates, boundary, build, clippy, server-tests, portable-suites, engine-tests, arch-coverage, publish-dryrun]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    outputs:
      validated_head: ${{ steps.result.outputs.validated_head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: result
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'PY'
          import json, os
          names = ('changes', 'gates', 'boundary', 'build', 'clippy', 'server-tests', 'portable-suites', 'engine-tests', 'arch-coverage', 'publish-dryrun')
          needs = json.loads(os.environ['JOB_RESULTS'])
          if any(needs.get(name, {}).get('result') != 'success' for name in names):
              raise SystemExit('Complete CPU inventory did not succeed')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('validated_head=' + os.environ['GITHUB_SHA'] + '\n')
          print('Complete CPU inventory passed: ' + os.environ['GITHUB_SHA'])
          PY
