name: gpu-ci

# GPU time is requested for a final, immutable candidate. Ordinary revision checks
# stay in ci.yml. The coordinator provisions only after the build job completes.
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full 40-character commit to qualify
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPYCACHEPREFIX: /tmp/memra-gpu-ci-python-${{ github.run_id }}-${{ github.run_attempt }}

concurrency:
  group: gpu-ci-${{ inputs.candidate }}-pro-ubuntu24
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      admitted: ${{ steps.admission.outputs.admitted }}
      reused: ${{ steps.reuse.outputs.qualified }}
      artifact-id: ${{ steps.capsule.outputs.artifact-id }}
      capsule-sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0
      - name: validate the candidate and qualification prerequisites
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          python3 - "$CANDIDATE" <<'PY'
          import importlib.util, pathlib, sys
          path = pathlib.Path("tools/gpu-ci.py")
          spec = importlib.util.spec_from_file_location("gpu_ci", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.candidate(pathlib.Path.cwd(), sys.argv[1])
          PY
      - name: reuse only a verified content-equivalent native record
        id: reuse
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          if python3 tools/release_qualification.py verify --fetch-source --head "$CANDIDATE" \
              --profile ubuntu-24.04 > "$RUNNER_TEMP/reused-qualification.json"; then
            echo "qualified=true" >> "$GITHUB_OUTPUT"
          else
            echo "No reusable native qualification; a new controlled build and GPU capture are required."
            echo "qualified=false" >> "$GITHUB_OUTPUT"
          fi
      - name: require pinned oracle and lease-wrapper inputs before spending GPU time
        if: steps.reuse.outputs.qualified != 'true'
        env:
          CANDIDATE: ${{ inputs.candidate }}
          MANIFEST_URL: ${{ vars.GPU_CI_INPUTS_URL }}
          MANIFEST_SHA256: ${{ vars.GPU_CI_INPUTS_SHA256 }}
        run: |
          python3 tools/gpu-ci.py preflight --candidate "$CANDIDATE" \
            --manifest-url "$MANIFEST_URL" --manifest-sha256 "$MANIFEST_SHA256" \
            --out "$RUNNER_TEMP/oracle-manifest.json"
      - name: admit a configured qualification request
        id: admission
        run: echo "admitted=true" >> "$GITHUB_OUTPUT"
      - name: install the pinned CUDA compiler
        if: steps.reuse.outputs.qualified != 'true'
        run: bash tools/install-cuda-ci.sh
      - name: install the isolated build sandbox
        if: steps.reuse.outputs.qualified != 'true'
        run: bash tools/install-release-sandbox-ci.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: steps.reuse.outputs.qualified != 'true'
        with:
          toolchain: "1.97.1"
      - name: build once without a GPU
        if: steps.reuse.outputs.qualified != 'true'
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          python3 tools/qualify-release.py build --expected-head "$CANDIDATE" \
            --out "$RUNNER_TEMP/native-build" --nvcc /usr/local/cuda-13.1/bin/nvcc \
            --bwrap /usr/local/libexec/memra-release-sandbox/bwrap --jobs 4
          cp "$RUNNER_TEMP/oracle-manifest.json" "$RUNNER_TEMP/native-build/oracle-manifest.json"
          python3 tools/gpu-ci.py pack-build --candidate "$CANDIDATE" \
            --build "$RUNNER_TEMP/native-build" --out "$RUNNER_TEMP/native-build.tar"
      - name: bind the build capsule bytes
        id: digest
        if: steps.reuse.outputs.qualified != 'true'
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/native-build.tar" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: retain the controlled build for the GPU job
        id: capsule
        if: steps.reuse.outputs.qualified != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpu-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-build.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: retain build or reuse diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpu-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-build/build*.json
            ${{ runner.temp }}/native-build/*.log
            ${{ runner.temp }}/reused-qualification.json
          retention-days: 7

  gpu:
    needs: build
    if: needs.build.outputs.reused != 'true'
    runs-on: ${{ format('memra-ci-pro-ubuntu24-{0}', github.run_id) }}
    timeout-minutes: 150
    outputs:
      qualified-candidate: ${{ steps.capture.outputs.qualified-candidate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/capsule
          merge-multiple: true
      - name: verify the exact controlled build capsule
        env:
          CANDIDATE: ${{ inputs.candidate }}
          CAPSULE_SHA256: ${{ needs.build.outputs.capsule-sha256 }}
        run: |
          printf '%s  %s\n' "$CAPSULE_SHA256" "$RUNNER_TEMP/capsule/native-build.tar" | sha256sum --check -
          python3 tools/gpu-ci.py unpack-build --candidate "$CANDIDATE" \
            --archive "$RUNNER_TEMP/capsule/native-build.tar" --out "$RUNNER_TEMP/native-build"
      - name: capture and seal the required native battery
        id: capture
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          python3 tools/gpu-ci.py capture --candidate "$CANDIDATE" \
            --build "$RUNNER_TEMP/native-build" --inputs "$RUNNER_TEMP/native-inputs" \
            --out "$RUNNER_TEMP/native-evidence"
      - name: retain native evidence, including failures and lease cleanup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpu-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-evidence
            ${{ runner.temp }}/native-evidence-lease
          retention-days: 30

  qualification-result:
    needs: [build, gpu]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:
      - name: report an unconfigured request without judging its candidate
        if: needs.build.outputs.admitted != 'true'
        run: |
          echo "::error::GPU qualification was not admitted. Check the prerequisite tooling and pinned input manifest. No candidate check run is published."
          exit 1
      - name: attach the scoped result to the tested candidate
        if: needs.build.outputs.admitted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate }}
          BUILD_RESULT: ${{ needs.build.result }}
          REUSED: ${{ needs.build.outputs.reused }}
          GPU_RESULT: ${{ needs.gpu.result }}
          QUALIFIED_CANDIDATE: ${{ needs.gpu.outputs.qualified-candidate }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          candidate = os.environ["CANDIDATE"]
          if not re.fullmatch(r"[0-9a-f]{40}", candidate):
              raise SystemExit("invalid candidate; no check is attached")
          passed = os.environ["BUILD_RESULT"] == "success" and (
              os.environ["REUSED"] == "true" or (
                  os.environ["GPU_RESULT"] == "success"
                  and os.environ["QUALIFIED_CANDIDATE"] == candidate
              )
          )
          data = {
              "name": "gpu-qualification/pro-ubuntu24",
              "head_sha": candidate, "status": "completed",
              "conclusion": "success" if passed else "failure",
              "details_url": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "output": {
                  "title": "Native qualification passed" if passed else "Native qualification incomplete",
                  "summary": "Scope: controlled native build and the required single-card RTX PRO 6000 Ubuntu 24.04 battery. Release publication and other hardware/serving qualifications retain their own gates."
              }
          }
          pathlib.Path(os.environ["RUNNER_TEMP"], "gpu-check.json").write_text(json.dumps(data))
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input "$RUNNER_TEMP/gpu-check.json"
          python3 -c 'import json,os,pathlib; r=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"],"gpu-check.json").read_text()); raise SystemExit(0 if r["conclusion"]=="success" else 1)'
