name: Prompt prefix depth

on:
  workflow_dispatch:
    inputs:
      build_native:
        type: boolean
        default: true
        description: Compile the two native GPU programs on the CPU runner
  workflow_call:
    inputs:
      build_native:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: prompt-prefix-depth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prefix-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.97.1"
      - name: Verify prefix limits and unseen-tail invariance
        run: |
          rustc --edition=2024 --test research/prompt-depth-router-20260922/prefix/check.rs \
            -o "$RUNNER_TEMP/prefix-policy-tests"
          "$RUNNER_TEMP/prefix-policy-tests"
      - name: Verify preparation against the pinned native source
        run: |
          python3 research/prompt-depth-router-20260922/prefix/prepare.py \
            --source-archive research/mtp-context-depth-20260921/latest-receipts/runtime-source.tar.gz \
            --out "$RUNNER_TEMP/prefix-source"
      - name: Check raw prefix auditing, format coverage and paired metrics
        run: |
          python3 -m unittest discover -s research/prompt-depth-router-20260922/prefix -p 'test_*.py' -v
          python3 -m compileall -q research/prompt-depth-router-20260922/prefix
          rustc --edition=2024 -O research/prompt-depth-router-20260922/prefix/replay.rs \
            -o "$RUNNER_TEMP/prefix-replay"

  native-build:
    if: ${{ github.event_name == 'pull_request' || inputs.build_native }}
    needs: prefix-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install CUDA compiler without allocating a GPU
        run: tools/install-cuda-ci.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.97.1"
          components: clippy
      - name: Build native drivers for the bounded-prefix comparison
        run: |
          python3 research/prompt-depth-router-20260922/prefix/build.py \
            --source-archive research/mtp-context-depth-20260921/latest-receipts/runtime-source.tar.gz \
            --out "$RUNNER_TEMP/prompt-prefix-native"
      - name: Retain source, programs and complete command records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prompt-prefix-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/prompt-prefix-native/*.json
            ${{ runner.temp }}/prompt-prefix-native/*.stdout
            ${{ runner.temp }}/prompt-prefix-native/*.stderr
            ${{ runner.temp }}/prompt-prefix-native/*.tar.gz
            ${{ runner.temp }}/prompt-prefix-native/binaries
          if-no-files-found: error
          retention-days: 7

  prefix-v2-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.97.1"
      - name: Independently replay and render all measured requests
        run: |
          lane=research/prompt-depth-router-20260922/prefix
          pin=$(cut -d ' ' -f 1 "$lane/receipts-v2/manifest.sha256")
          python3 "$lane/publication.py" \
            --receipts "$lane/receipts-v2" \
            --manifest-sha256 "$pin" \
            --out "$RUNNER_TEMP/prefix-v2-replay"
          python3 "$lane/render_results.py" \
            --source "$RUNNER_TEMP/prefix-v2-replay/RESULTS.json" \
            --out "$RUNNER_TEMP/prefix-v2-render"
          cp "$RUNNER_TEMP/prefix-v2-render/RESULTS.md" "$RUNNER_TEMP/prefix-v2-replay/RESULTS.md"
      - name: Retain independently replayed reports for exact publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prompt-prefix-replayed-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/prefix-v2-replay/RESULTS.json
            ${{ runner.temp }}/prefix-v2-replay/RESULTS.md
          if-no-files-found: error
          retention-days: 3
      - name: Compare independently replayed reports with the publication
        run: |
          lane=research/prompt-depth-router-20260922/prefix
          cmp "$RUNNER_TEMP/prefix-v2-replay/RESULTS.json" "$lane/RESULTS.json"
          cmp "$RUNNER_TEMP/prefix-v2-replay/RESULTS.md" "$lane/RESULTS.md"

  confidence-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Re-audit every fixed-confidence request and the one-file runtime patch
        run: |
          lane=research/prompt-depth-router-20260922/confidence
          python3 -m compileall -q "$lane"
          python3 -m unittest discover -s "$lane" -p 'test_*.py' -v
          pin=$(cut -d ' ' -f 1 "$lane/receipts-v1/manifest.sha256")
          python3 "$lane/reproduce.py" \
            --candidate "$lane/receipts-v1" \
            --manifest-sha256 "$pin" \
            --base research/prompt-depth-router-20260922/prefix/receipts-v2/runtime-source.tar.gz \
            --out "$RUNNER_TEMP/confidence-replay"
          cmp "$RUNNER_TEMP/confidence-replay/RESULTS.json" "$lane/RESULTS.json"
          cmp "$RUNNER_TEMP/confidence-replay/RESULTS.md" "$lane/RESULTS.md"
          cmp "$RUNNER_TEMP/confidence-replay/OFFLINE-RESULTS.json" "$lane/OFFLINE-RESULTS.json"
          cmp "$RUNNER_TEMP/confidence-replay/HELDOUT-RESULTS.json" "$lane/HELDOUT-RESULTS.json"
          cmp "$RUNNER_TEMP/confidence-replay/HELDOUT-RESULTS.md" "$lane/HELDOUT-RESULTS.md"
          cmp "$RUNNER_TEMP/confidence-replay/FAILED-QUALIFICATION.json" "$lane/FAILED-QUALIFICATION.json"
          cmp "$RUNNER_TEMP/confidence-replay/PHASE-RESULTS.json" "$lane/PHASE-RESULTS.json"
      - name: Retain exact replay receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-confidence-replay-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/confidence-replay/REPLAY.json
            ${{ runner.temp }}/confidence-replay/RESULTS.json
            ${{ runner.temp }}/confidence-replay/RESULTS.md
            ${{ runner.temp }}/confidence-replay/OFFLINE-RESULTS.json
            ${{ runner.temp }}/confidence-replay/HELDOUT-RESULTS.json
            ${{ runner.temp }}/confidence-replay/HELDOUT-RESULTS.md
            ${{ runner.temp }}/confidence-replay/FAILED-QUALIFICATION.json
            ${{ runner.temp }}/confidence-replay/PHASE-RESULTS.json
          if-no-files-found: error
          retention-days: 7

  confidence-v3-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check evidence-derived C behavior on the hosted CPU
        run: |
          python3 -m unittest discover \
            -s research/prompt-depth-router-20260922/confidence/adaptive-v3 \
            -p 'test_*.py' -v
      - name: Install the CUDA compiler without allocating a GPU
        run: tools/install-cuda-ci.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.97.1"
      - name: Rebuild the pinned corrected research source and compile its native driver
        run: |
          lane=research/prompt-depth-router-20260922/confidence
          python3 "$lane/adaptive-v3/patch_source.py" \
            --base "$lane/receipts-v1/runtime-source-confidence.tar.gz" \
            --out "$RUNNER_TEMP/confidence-v3-source"
          cd "$RUNNER_TEMP/confidence-v3-source/repo"
          cargo check --locked -p memra-engine --bin mtp-depth-study

  confidence-v3-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Replay sealed live-confidence native requests and code probes
        run: |
          lane=research/prompt-depth-router-20260922/confidence/adaptive-v3
          python3 "$lane/patch_source.py" \
            --base research/prompt-depth-router-20260922/confidence/receipts-v1/runtime-source-confidence.tar.gz \
            --out "$RUNNER_TEMP/confidence-v3-source-replay"
          cmp "$RUNNER_TEMP/confidence-v3-source-replay/runtime-source-adaptive-v3.tar.gz" \
            "$lane/receipts-v3/runtime-source-adaptive-v3.tar.gz"
          python3 "$lane/quality.py" --self-check
          python3 "$lane/replay.py" \
            --candidate "$lane/receipts-v3" \
            --workloads "$lane/workloads-v3" \
            --out "$RUNNER_TEMP/confidence-v3-replay"
          cmp "$RUNNER_TEMP/confidence-v3-replay/RESULTS.json" "$lane/RESULTS.json"
          cmp "$RUNNER_TEMP/confidence-v3-replay/QUALITY.json" "$lane/QUALITY.json"
          cmp "$RUNNER_TEMP/confidence-v3-replay/RESULTS.md" "$lane/RESULTS.md"
      - name: Retain independently replayed v3 result files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-confidence-v3-replay-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/confidence-v3-replay/RESULTS.json
            ${{ runner.temp }}/confidence-v3-replay/QUALITY.json
            ${{ runner.temp }}/confidence-v3-replay/RESULTS.md
          if-no-files-found: ignore
          retention-days: 7

  joint-v4-history-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check causal accepted-prefix and history-feature boundaries
        run: |
          python3 -m unittest discover \
            -s research/prompt-depth-router-20260922/joint-v4 \
            -p 'test_*.py' -v
      - name: Fit tiny acceptance predictors on archived development conversations
        run: |
          lane=research/prompt-depth-router-20260922
          python3 "$lane/joint-v4/pilot.py" \
            --archive "$lane/confidence/adaptive-v3/receipts-v3/native-data.tar.gz" \
            --workloads "$lane/confidence/adaptive-v3/workloads-v3/manifest.json" \
            --out "$RUNNER_TEMP/joint-v4-pilot.json"
          cmp "$RUNNER_TEMP/joint-v4-pilot.json" "$lane/joint-v4/PILOT.json"
      - name: Replay whole-conversation fixed controls and frozen fresh prompts
        run: |
          lane=research/prompt-depth-router-20260922
          python3 "$lane/joint-v4/static_oracle.py" \
            --archive "$lane/confidence/adaptive-v3/receipts-v3/native-data.tar.gz" \
            --workloads "$lane/confidence/adaptive-v3/workloads-v3/manifest.json" \
            --out "$RUNNER_TEMP/joint-v4-static-oracle.json"
          cmp "$RUNNER_TEMP/joint-v4-static-oracle.json" \
            "$lane/joint-v4/STATIC-ORACLE.json"
          python3 "$lane/joint-v4/workloads.py" \
            --out "$RUNNER_TEMP/joint-v4-workloads"
          diff -r "$RUNNER_TEMP/joint-v4-workloads" "$lane/joint-v4/workloads-v4"
      - name: Retain observational feature pilot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: joint-v4-history-pilot-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/joint-v4-pilot.json
            ${{ runner.temp }}/joint-v4-static-oracle.json
          if-no-files-found: ignore
          retention-days: 7

  joint-v4-native-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install CUDA compiler without allocating a GPU
        run: tools/install-cuda-ci.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.97.1"
      - name: Rebuild randomized-depth source and compile native driver
        run: |
          lane=research/prompt-depth-router-20260922
          python3 -m py_compile \
            "$lane/joint-v4/run_native.py" \
            "$lane/joint-v4/analyze_training.py" \
            "$lane/joint-v4/train_depth.py" \
            "$lane/joint-v4/train_confidence.py" \
            "$lane/joint-v4/quality.py" \
            "$lane/joint-v4/analyze_selection.py" \
            "$lane/joint-v4/analyze_final.py" \
            "$lane/joint-v4/diagnostics.py" \
            "$lane/joint-v4/seal.py" \
            "$lane/joint-v4/replay.py"
          python3 "$lane/joint-v4/patch_source.py" \
            --base "$lane/confidence/adaptive-v3/receipts-v3/runtime-source-adaptive-v3.tar.gz" \
            --out "$RUNNER_TEMP/joint-v4-native"
          cd "$RUNNER_TEMP/joint-v4-native/repo"
          cargo check --locked -p memra-engine --bin mtp-depth-study
          cargo test --locked -p memra-engine --lib learned_depth::tests
      - name: Retain pinned source preflight
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: joint-v4-native-cpu-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/joint-v4-native/source.json
            ${{ runner.temp }}/joint-v4-native/runtime-source-joint-v4.tar.gz
          if-no-files-found: ignore
          retention-days: 7

  joint-v4-native-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install CUDA compiler without allocating a GPU
        run: tools/install-cuda-ci.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.97.1"
      - name: Build pinned in-process policy for RTX 5090
        run: |
          lane=research/prompt-depth-router-20260922
          python3 "$lane/joint-v4/patch_source.py" \
            --base "$lane/confidence/adaptive-v3/receipts-v3/runtime-source-adaptive-v3.tar.gz" \
            --out "$RUNNER_TEMP/joint-v4-release"
          cd "$RUNNER_TEMP/joint-v4-release/repo"
          MEMRA_CUDA_ARCH=120a cargo build --release --locked \
            -p memra-engine --bin mtp-depth-study
          sha256sum target/release/mtp-depth-study \
            > "$RUNNER_TEMP/joint-v4-release/binary.sha256"
          cp target/release/mtp-depth-study \
            "$RUNNER_TEMP/joint-v4-release/mtp-depth-study"
      - name: Retain source and RTX 5090 policy program
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: joint-v4-native-release-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/joint-v4-release/source.json
            ${{ runner.temp }}/joint-v4-release/runtime-source-joint-v4.tar.gz
            ${{ runner.temp }}/joint-v4-release/binary.sha256
            ${{ runner.temp }}/joint-v4-release/mtp-depth-study
          if-no-files-found: ignore
          retention-days: 7
