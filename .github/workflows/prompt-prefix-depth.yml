name: Prompt prefix depth

on:
  pull_request:
    paths:
      - research/prompt-depth-router-20260922/prefix/**
      - research/prompt-depth-router-20260922/router.rs
      - research/prompt-depth-router-20260922/prepare_native.py
      - .github/workflows/prompt-prefix-depth.yml
  workflow_dispatch:
    inputs:
      build_native:
        type: boolean
        default: true
        description: Compile the two native GPU programs on the CPU runner
  workflow_call:
    inputs:
      build_native:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: prompt-prefix-depth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prefix-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.97.1"
      - name: Verify prefix limits and unseen-tail invariance
        run: |
          rustc --edition=2024 --test research/prompt-depth-router-20260922/prefix/check.rs \
            -o "$RUNNER_TEMP/prefix-policy-tests"
          "$RUNNER_TEMP/prefix-policy-tests"
      - name: Verify preparation against the pinned native source
        run: |
          python3 research/prompt-depth-router-20260922/prefix/prepare.py \
            --source-archive research/mtp-context-depth-20260921/latest-receipts/runtime-source.tar.gz \
            --out "$RUNNER_TEMP/prefix-source"
      - name: Check raw prefix auditing, format coverage and paired metrics
        run: |
          python3 -m unittest discover -s research/prompt-depth-router-20260922/prefix -p 'test_*.py' -v
          python3 -m compileall -q research/prompt-depth-router-20260922/prefix
          rustc --edition=2024 -O research/prompt-depth-router-20260922/prefix/replay.rs \
            -o "$RUNNER_TEMP/prefix-replay"

  native-build:
    if: ${{ github.event_name == 'pull_request' || inputs.build_native }}
    needs: prefix-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install CUDA compiler without allocating a GPU
        run: tools/install-cuda-ci.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.97.1"
          components: clippy
      - name: Build native drivers for the bounded-prefix comparison
        run: |
          python3 research/prompt-depth-router-20260922/prefix/build.py \
            --source-archive research/mtp-context-depth-20260921/latest-receipts/runtime-source.tar.gz \
            --out "$RUNNER_TEMP/prompt-prefix-native"
      - name: Retain source, programs and complete command records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prompt-prefix-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/prompt-prefix-native/*.json
            ${{ runner.temp }}/prompt-prefix-native/*.stdout
            ${{ runner.temp }}/prompt-prefix-native/*.stderr
            ${{ runner.temp }}/prompt-prefix-native/*.tar.gz
            ${{ runner.temp }}/prompt-prefix-native/binaries
          if-no-files-found: error
          retention-days: 7
