# VENDOR SOURCE: Qwen/Qwen3.5-9B model card (revision c202236235762e1c871ad0ccb60c8ee5ba337b9a),
# "Best Practices" -> sampling parameters. Thinking mode for general tasks is the primary arm;
# Instruct (non-thinking) mode for general tasks is the second arm. Do not "clean up" these numbers.
[models."qwen/qwen3.5-9b"]
description = "Qwen3.5-9B NVFP4 + MTP GGUF, hebrew-agentic perf-page cell."
quantization = "nvfp4"
max_prompt_length = 32768
max_output_length = 32768
default_output_length = 1024
is_ready = true

default_temperature = 1.0
default_top_p = 0.95
default_top_k = 20
default_min_p = 0.0
default_presence_penalty = 1.5
default_repetition_penalty = 1.0

[models."qwen/qwen3.5-9b".non_thinking_sampling]
# Vendor: "Instruct (or non-thinking) mode for general tasks".
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
presence_penalty = 1.5
repetition_penalty = 1.0
