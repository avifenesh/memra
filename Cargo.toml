[workspace]
resolver = "2"
members = ["crates/memra-cli", "crates/memra-probe", "crates/memra-gguf", "crates/memra-reference", "crates/memra-runtime", "crates/memra-engine", "crates/memra-tokenizer", "crates/memra-sampling", "crates/memra-validate", "crates/memra-kv", "crates/memra-lanes", "crates/memra-server"]

# Shared crates.io metadata (docs/RELEASING.md "Publishing to crates.io"): every member
# inherits via `<field>.workspace = true`. The version is the release tag — bump it as
# part of cutting vX.Y.Z (publish.yml refuses a tag/version mismatch).
[workspace.package]
version = "0.122.0"
license = "MIT"
repository = "https://github.com/avifenesh/memra"
homepage = "https://github.com/avifenesh/memra"
rust-version = "1.97"
# crates.io browse surfaces. The crates carried NEITHER field until now, which meant
# they appeared under no category and no keyword — findable only by exact name.
# `artificial-intelligence` holds ~194 crates against 29,250 in command-line-utilities,
# so the whole category fits on a few pages: being in it is worth more than being
# buried in a large one. Keywords are capped at five by crates.io, so they run one
# broad (llm) and four where a search can actually land on us.
categories = ["artificial-intelligence", "hardware-support"]
keywords = ["llm", "inference", "cuda", "gguf", "safetensors"]

# Intra-workspace deps carry BOTH path (local builds) and a pinned `=` version: crates.io
# strips the path on publish, and the memra crates evolve in lockstep — mixed versions
# across the workspace are never a supported configuration.
[workspace.dependencies]
memra-gguf = { path = "crates/memra-gguf", version = "=0.122.0" }
memra-sampling = { path = "crates/memra-sampling", version = "=0.122.0" }
memra-validate = { path = "crates/memra-validate", version = "=0.122.0" }
memra-kv = { path = "crates/memra-kv", version = "=0.122.0" }
memra-lanes = { path = "crates/memra-lanes", version = "=0.122.0" }
memra-tokenizer = { path = "crates/memra-tokenizer", version = "=0.122.0" }
memra-runtime = { path = "crates/memra-runtime", version = "=0.122.0" }
memra-engine = { path = "crates/memra-engine", version = "=0.122.0" }
memra-reference = { path = "crates/memra-reference", version = "=0.122.0" }
